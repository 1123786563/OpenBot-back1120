# T01 isolated integration environment: OpenBot server + Casdoor + Postgres.
#
# Deliberately NOT the repo's docker-compose.yml:
# - its own compose project (openbot-t01), so `docker compose -p openbot-t01 down -v`
#   can only ever remove this ticket's resources;
# - its own network and named volumes, never `openbot_default` or `casdoor-data`;
# - loopback ports 18000 (Casdoor), 13010 (OpenBot app), 13001 (OpenBot API),
#   off the 8000/3010/3001 the existing deployment uses;
# - images pinned by digest from scripts/t01/versions.lock (00-pin-images.sh),
#   never the floating `main` tag.
#
# Postgres publishes no host port at all: only services on the t01-net reach it.
#
# This compose file has not been started yet (no container runtime was
# available when it was written; see implementation.md). First real `up` is
# expected to surface server env requirements not listed here (Intelligence /
# license keys); 10-up.sh fails loudly if the server never turns healthy.

name: openbot-t01

services:
  postgres:
    image: ${T01_PGVECTOR_IMAGE:?run scripts/t01/00-pin-images.sh first}
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot-t01
      POSTGRES_DB: openbot
    volumes:
      - t01-postgres-data:/var/lib/postgresql/data
    networks: [t01-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: ${T01_SERVER_IMAGE:?run scripts/t01/00-pin-images.sh first}
    entrypoint: ["/app/bin/openbot", "server"]
    working_dir: /app/server
    restart: unless-stopped
    env_file:
      - path: ${T01_ENV_FILE:?set T01_ENV_FILE to scripts/t01/.env.t01}
        required: true
    environment:
      PORT: "3001"
      SERVER_PORT: "3001"
      NODE_ENV: ""
      # Inside the t01-net the database is the postgres service, not loopback.
      DATABASE_URL: postgres://openbot:openbot-t01@postgres:5432/openbot
      # BETTER_AUTH_URL is the address OAuth callbacks return to; the server
      # serves the app itself, so one port reaches both halves on one origin.
      BETTER_AUTH_URL: http://127.0.0.1:${T01_APP_PORT:-13010}
      OPENBOT_EDITION: team
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${T01_APP_PORT:-13010}:3001"
      - "127.0.0.1:${T01_SERVER_PORT:-13001}:3001"
    networks: [t01-net]
    healthcheck:
      # The server only listens after applying its own migrations.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  casdoor:
    image: ${T01_CASDOOR_IMAGE:?run scripts/t01/00-pin-images.sh first}
    entrypoint: ["/server"]
    restart: unless-stopped
    environment:
      driverName: sqlite
      dataSourceName: "file:/data/casdoor.db?cache=shared"
      dbName: casdoor
      origin: http://127.0.0.1:${T01_CASDOOR_PORT:-18000}
      runmode: prod
      # Fresh database only: never seed from or attach to an existing user DB.
      initDataNewOnly: "true"
    volumes:
      - t01-casdoor-data:/data
    ports:
      - "127.0.0.1:${T01_CASDOOR_PORT:-18000}:8000"
    networks: [t01-net]

volumes:
  t01-postgres-data:
  t01-casdoor-data:

networks:
  t01-net:
    name: t01-net
