# Only registered labels, severity and correlation IDs leave the collector.
# Free-form lines are accounted for with a fixed summary. Read the original
# message via the deployment's restricted local logs when more detail is needed.
extensions:
  file_storage/queue:
    directory: /var/lib/otelcol

receivers:
  fluent_forward/runtime:
    endpoint: 0.0.0.0:24224
  otlp/audit:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  filter/runtime:
    logs:
      log_record:
        - 'not IsString(attributes["fluent.tag"]) or not IsMatch(attributes["fluent.tag"], "^openbot[.](postgres|migrate|server|worker|agent-bot|agent-computer|agent-langgraph|agent-harness|supervisor|spire-init|spire-server|spire-agent|computer|carry-over)$")'

  groupbyattrs/runtime:
    keys: [fluent.tag]

  transform/runtime:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], Split(resource.attributes["fluent.tag"], ".")[1])
            where IsString(resource.attributes["fluent.tag"])
          - keep_keys(resource.attributes, ["service.name"])
          - set(resource.attributes["deployment.environment"], "${env:OO_ENVIRONMENT_LABEL}")
          - set(resource.attributes["log_class"], "runtime")
          - keep_keys(attributes, ["source"])
          - set(cache["data"], ParseJSON(body)) where IsString(body) and IsMatch(body, "^\\s*\\{")
          # Info is the baseline every later rule overrides from: the registry, the pinned
          # templates and the third-party prefixes all run after this line.
          - set(severity_text, "Info")
          # The registry below is generated from the console call sites themselves
          # (scripts/observability/log-registry.py): a structured event carries the level the call
          # that wrote it carries, so a Warn can never arrive as an Error and a real business event
          # can never arrive as an unclassified summary. --check fails any drift.
          # BEGIN GENERATED LOG REGISTRY
          # 253 structured events, levels taken from their console call sites.
          # Regenerate with `python3 scripts/observability/log-registry.py`; verify with --check.
          # Events: 253; Warn: 57; Error: 141; Info is the default.
                # fmt: the long alternations below are generated, not hand-wrapped.
          - set(attributes["openbot.log_type"], cache["data"]["type"]) where IsString(cache["data"]["type"]) and IsMatch(cache["data"]["type"], "^(action-policy-notify-failed|action-policy-refresh-failed|action-record-failed|action-record-purge-failed|action-stopped|agent-key-revoke-failed|agent-stream-stalled|agent-turn-failed|agent-unreachable|approval-abandon-error|approval-resume-error|arcade-attempt-under-retired-name|arcade-cancelled-grant-left-live|arcade-cancelled-grant-left-live-not-filed|arcade-completion-not-permitted|arcade-completion-status-unknown|arcade-context-withdrawal-unknown|arcade-mint-not-recorded|arcade-mint-outcome-unknown|arcade-refused-attempt-not-cleared|arcade-return-confirmation-unknown|arcade-sibling-resolution-unknown|arcade-verifier-elsewhere|arcade-verifier-not-pointed|arcade-verifier-pointed|arcade-verifier-unread|arcade-verify-failed|audit-ask-model-failed|audit-retention-failed|audit-retention-swept|audit-tap-failed|bot-audit-write-failed|bot-browser-cleared-not-recorded|bot-browser-connect-failed|bot-browser-policy-push-failed|bot-browser-record-no-address|bot-browser-revoke-failed|bot-browser-settle-failed|bot-follow-up|bot-follow-up-error|bot-handoff|bot-handoff-reaped|bot-pause-check-failed|broker-return-url-unusable|broker-sentence-kept-from-person|brokered-app-relist-failed|browser-cleared-connection-not-revoked|browser-cleared-not-recorded|browser-computer-failed|browser-computer-slow|browser-computer-unreachable|browser-connect-failed|browser-disconnect-failed|browser-disconnect-refused|browser-not-reopened-after-clear|browser-open-no-address|browser-turn-overrun|capability-check-failed|channel-audit-write-failed|channel-summaries|channel-summary-gave-up|composio-app-not-enabled|computer-bar-navigation-failed|computer-bot-browser-cleared|computer-bot-browser-not-started|computer-bot-recorder-unavailable|computer-bot-recording-connect-failed|computer-bot-recording-ended|computer-bot-recording-refused|computer-bot-recording-started|computer-bot-recording-still-sending|computer-browser-cleared|computer-browser-closed|computer-browser-closed-for-memory|computer-browser-mode|computer-browser-network-unavailable|computer-browser-not-answering|computer-browser-open-failed|computer-browser-recording-ended|computer-browser-recording-not-ended|computer-cull-gave-up|computer-filter-credentials-not-held|computer-handoff-page-not-restored|computer-handoff-page-restored|computer-isolation|computer-legacy-stop-failed|computer-legacy-stopped|computer-loopback-relay|computer-page-changed|computer-person-filled-not-marked|computer-person-native-hosts|computer-policy-expression-error|computer-profile-carried-over|computer-profile-carry-over-failed|computer-real-browser-failed|computer-recorder-id-differs|computer-recorder-reloaded|computer-sandbox|computer-sandbox-still-starting|computer-sandbox-update-resume-failed|computer-sandbox-updated|computer-session-cookies-not-restored|computer-shell-env-ignored|computer-shell-env-refused|computer-tab-closed|computer-virtual-display-exited|computer-web-bot-auth-refused|computer-web-bot-auth-sign-failed|computer-window-not-fitted|decision-wait-write-failed|delivery-lease-renewal-failed|delivery-route-error|delivery-worker-error|egress-policy-push-on-wake-failed|email-trigger-error|enterprise-audit-failed|enterprise-controls-refresh-failed|enterprise-listen-failed|enterprise-policy-overlay-error|entra-profile-missing-email|entra-token-client-not-allowed|entra-token-refused|entra-token-sign-in-refused|follow-up-audit-write-failed|github-responsibility-event-error|group-sweep-error|group-turn-after-reply-error|headless-capability-check-failed|identity-github-callback-failed|identity-github-callback-refused|identity-link-audit-failed|identity-link-unknown-provider|inactive-computer-stop-failed|inactive-computer-sweep-failed|initialization-barrier-arrived|initialization-barrier-expired|initialization-barrier-open|initialization-barrier-single|initialization-barrier-waiting|initialization-fault-armed|initialization-fault-hit|isolation-capability-read-failed|langgraph-turn-failed|learning-admin-error|learning-audit-failed|learning-auto-approve-failed|learning-auto-approve-sweep-error|learning-open-skills-unread|learning-people-proposals-failed|learning-personal-skills-unavailable|learning-personal-space-not-made|learning-skill-sources-unread|learning-withheld-unread|mcp-oauth-client-read-failed|mcp-server-not-removed|mcp-tools-unofferable-names-skipped|memory-mirror-error|memory-route-error|memory-sync-error|model-choice-route-error|model-provider-refused|model-usage-write-failed|oauth-callback-failed|oauth-connection-not-recorded|oauth-connection-tools-not-listed|oauth-registration-endpoint-unreachable|oauth-registration-endpoint-unusable|oauth-token-endpoint-unreachable|oauth-token-endpoint-unusable|offboard-computers-failed|offboard-retire-failed|openai-api|opentag-link-code-discard-error|opentag-run-error|opentag-run-invalid|opentag-slack-trigger-error|otel-export-failed|own-app-tools-refresh-failed|package-skill-skipped|page-frames-sweep-failed|page-frames-swept|password-save-failed|passwords-route-error|person-response-error|policy-change-unrecorded|policy-translate-model-failed|proactive-capability-read-failed|proactive-daily-runs-read-failed|proactive-ledger-sweep-failed|proactive-ledger-swept|proactive-route-error|proactive-sweep-error|product-telemetry|recorder-audit-write-failed|recorder-connect-failed|recorder-expiry-sweep-error|recorder-learning-space-kick-failed|recorder-organization-end-failed|recorder-refusal-audit-write-failed|recorder-revoke-failed|recorder-sign-out-failed|recorder-summaries-dropped|recorder-summaries-failed|recorder-trajectory-learning-cut-short|recorder-trajectory-refusal-audit-write-failed|responsibility-dispatch|responsibility-dispatch-error|responsibility-route-error|responsibility-trigger-audit-failed|responsibility-trigger-error|routine-activity-unrecorded|routine-dispatch-audit-write-failed|routine-fatigue-rule-failed|routine-fire-finish-lost|routine-fire-gave-up|routine-fire-redelivery-possible|routine-fire-release-failed|routine-fire-release-lost|routine-run-crashed|routine-run-reap-failed|routine-runs-reaped|routine-sweep|routine-sweep-disable-failed|routine-sweep-heartbeat-failed|routine-sweep-offer-failed|routine-sweep-purge|routine-sweep-purge-failed|routine-sweep-tick-failed|run-model|scim-offboard-failed|screencast-input-error|setup-checklist-route-error|shared-rule-not-forgotten|sign-in-audit-write-failed|sign-in-notify-failed|sign-in-resume-failed|sign-in-route-error|sign-in-stamp-write-failed|single-user-connections-retired|sso-config-decrypt-failed|starter-tour-claim-failed|task-sweep-error|task-turn-error|tasks-route-error|thread-status-check-failed|tool-limit-trimmed|tool-selection-unavailable|turn-watchdog-callback-error|unhandled-rejection|update-route-lookup-failed|voice-history-failed|voice-summary-failed|what-if-model-failed)$")
          - set(severity_text, "Warn") where IsString(attributes["openbot.log_type"]) and IsMatch(attributes["openbot.log_type"], "^(audit-ask-model-failed|bot-browser-policy-push-failed|bot-browser-record-no-address|brokered-app-relist-failed|browser-computer-failed|browser-computer-slow|browser-disconnect-refused|browser-not-reopened-after-clear|browser-open-no-address|browser-turn-overrun|channel-summary-gave-up|computer-browser-network-unavailable|computer-browser-not-answering|computer-cull-gave-up|computer-legacy-stop-failed|computer-profile-carry-over-failed|computer-sandbox-still-starting|computer-shell-env-ignored|computer-shell-env-refused|computer-web-bot-auth-refused|computer-web-bot-auth-sign-failed|egress-policy-push-on-wake-failed|entra-token-client-not-allowed|entra-token-refused|entra-token-sign-in-refused|identity-github-callback-refused|identity-link-unknown-provider|inactive-computer-stop-failed|isolation-capability-read-failed|learning-open-skills-unread|learning-personal-skills-unavailable|learning-withheld-unread|mcp-tools-unofferable-names-skipped|own-app-tools-refresh-failed|package-skill-skipped|policy-translate-model-failed|proactive-capability-read-failed|proactive-daily-runs-read-failed|product-telemetry|recorder-trajectory-learning-cut-short|routine-fire-finish-lost|routine-fire-gave-up|routine-fire-redelivery-possible|routine-fire-release-failed|routine-fire-release-lost|routine-run-reap-failed|routine-runs-reaped|routine-sweep-disable-failed|routine-sweep-heartbeat-failed|routine-sweep-offer-failed|routine-sweep-purge-failed|routine-sweep-tick-failed|single-user-connections-retired|tool-limit-trimmed|tool-selection-unavailable|voice-summary-failed|what-if-model-failed)$")
          - set(severity_text, "Error") where IsString(attributes["openbot.log_type"]) and IsMatch(attributes["openbot.log_type"], "^(action-policy-notify-failed|action-policy-refresh-failed|action-record-failed|action-record-purge-failed|agent-key-revoke-failed|agent-stream-stalled|agent-turn-failed|agent-unreachable|approval-abandon-error|approval-resume-error|arcade-attempt-under-retired-name|arcade-cancelled-grant-left-live|arcade-cancelled-grant-left-live-not-filed|arcade-completion-not-permitted|arcade-completion-status-unknown|arcade-context-withdrawal-unknown|arcade-mint-not-recorded|arcade-mint-outcome-unknown|arcade-refused-attempt-not-cleared|arcade-return-confirmation-unknown|arcade-sibling-resolution-unknown|arcade-verifier-elsewhere|arcade-verifier-not-pointed|arcade-verifier-unread|arcade-verify-failed|audit-retention-failed|audit-tap-failed|bot-audit-write-failed|bot-browser-cleared-not-recorded|bot-browser-connect-failed|bot-browser-revoke-failed|bot-browser-settle-failed|bot-follow-up-error|bot-pause-check-failed|broker-return-url-unusable|broker-sentence-kept-from-person|browser-cleared-connection-not-revoked|browser-cleared-not-recorded|browser-computer-unreachable|browser-connect-failed|browser-disconnect-failed|capability-check-failed|channel-audit-write-failed|composio-app-not-enabled|computer-person-filled-not-marked|computer-policy-expression-error|computer-sandbox-update-resume-failed|computer-virtual-display-exited|decision-wait-write-failed|delivery-lease-renewal-failed|delivery-route-error|delivery-worker-error|email-trigger-error|enterprise-audit-failed|enterprise-controls-refresh-failed|enterprise-listen-failed|enterprise-policy-overlay-error|entra-profile-missing-email|follow-up-audit-write-failed|github-responsibility-event-error|group-sweep-error|group-turn-after-reply-error|headless-capability-check-failed|identity-github-callback-failed|identity-link-audit-failed|inactive-computer-sweep-failed|langgraph-turn-failed|learning-admin-error|learning-audit-failed|learning-auto-approve-failed|learning-auto-approve-sweep-error|learning-people-proposals-failed|learning-skill-sources-unread|mcp-oauth-client-read-failed|mcp-server-not-removed|memory-mirror-error|memory-route-error|memory-sync-error|model-choice-route-error|model-provider-refused|model-usage-write-failed|oauth-callback-failed|oauth-connection-not-recorded|oauth-connection-tools-not-listed|oauth-registration-endpoint-unreachable|oauth-registration-endpoint-unusable|oauth-token-endpoint-unreachable|oauth-token-endpoint-unusable|offboard-computers-failed|offboard-retire-failed|opentag-link-code-discard-error|opentag-run-error|opentag-run-invalid|opentag-slack-trigger-error|otel-export-failed|page-frames-sweep-failed|password-save-failed|passwords-route-error|person-response-error|policy-change-unrecorded|proactive-ledger-sweep-failed|proactive-route-error|proactive-sweep-error|recorder-audit-write-failed|recorder-connect-failed|recorder-expiry-sweep-error|recorder-learning-space-kick-failed|recorder-organization-end-failed|recorder-refusal-audit-write-failed|recorder-revoke-failed|recorder-sign-out-failed|recorder-summaries-dropped|recorder-summaries-failed|recorder-trajectory-refusal-audit-write-failed|responsibility-dispatch-error|responsibility-route-error|responsibility-trigger-audit-failed|responsibility-trigger-error|routine-activity-unrecorded|routine-dispatch-audit-write-failed|routine-fatigue-rule-failed|routine-run-crashed|scim-offboard-failed|screencast-input-error|setup-checklist-route-error|shared-rule-not-forgotten|sign-in-audit-write-failed|sign-in-notify-failed|sign-in-resume-failed|sign-in-route-error|sign-in-stamp-write-failed|sso-config-decrypt-failed|starter-tour-claim-failed|task-sweep-error|task-turn-error|tasks-route-error|thread-status-check-failed|turn-watchdog-callback-error|unhandled-rejection|update-route-lookup-failed|voice-history-failed)$")
          # END GENERATED LOG REGISTRY
          # Text events whose wording is stable, pinned by hand (the generator verifies the
          # literals still exist in the sources).
          - set(attributes["openbot.log_type"], "server-listening")
            where resource.attributes["service.name"] == "server" and IsString(body) and IsMatch(body, "^OpenBot server listening on ")
          - set(attributes["openbot.log_type"], "agent-listening")
            where IsMatch(resource.attributes["service.name"], "^agent-") and IsString(body) and IsMatch(body, " listening on ")
          - set(attributes["openbot.log_type"], "worker-status") where resource.attributes["service.name"] == "worker" and IsString(body) and IsMatch(body, "^OpenBot worker status")
          - set(attributes["openbot.log_type"], "postgres-ready")
            where resource.attributes["service.name"] == "postgres" and IsString(body) and IsMatch(body, "LOG:\\s+database system is ready to accept connections")
          # A handoff sweep failure is console.warn on stderr: an explicitly Warn line, not an
          # Error, and its fixed prefix — not its message — is what names it.
          - set(attributes["openbot.log_type"], "bot-handoff-sweep-failed")
            where resource.attributes["service.name"] == "server" and IsString(body) and IsMatch(body, "^\\[handoff\\] a sweep could not run:")
          - set(severity_text, "Warn") where attributes["openbot.log_type"] == "bot-handoff-sweep-failed"
          - set(severity_text, "Error")
            where resource.attributes["service.name"] == "postgres" and IsString(body) and IsMatch(body, "(ERROR|FATAL|PANIC):\\s")
          - set(severity_text, "Warn")
            where resource.attributes["service.name"] == "postgres" and IsString(body) and IsMatch(body, "WARNING:\\s")
          # Third-party images log their own level as a line prefix (postgres, SPIRE's
          # `level=...`, BusyBox, glibc). These prefixes are stable templates.
          - set(severity_text, "Warn")
            where resource.attributes["service.name"] != "postgres" and IsString(body) and IsMatch(body, "^(WARN|WARNING)(:|\\s)")
          - set(severity_text, "Error")
            where resource.attributes["service.name"] != "postgres" and IsString(body) and IsMatch(body, "^(ERROR|ERRO|FATAL|PANIC)(:|\\s)")
          - set(severity_text, "Info")
            where IsString(body) and IsMatch(body, "\\blevel=(debug|info|notice)\\b")
          - set(severity_text, "Warn")
            where IsString(body) and IsMatch(body, "\\blevel=(warn|warning)\\b")
          - set(severity_text, "Error")
            where IsString(body) and IsMatch(body, "\\blevel=error\\b")
          # Everything else that arrived on stderr with no registrable name and no prefix keeps
          # its time, service and the fixed summary, but the level is honestly Unknown: stderr
          # alone cannot distinguish a Bun warn from an error, and inventing Error is how a real
          # warning once ended up in every Error query.
          - set(severity_text, "Unknown")
            where attributes["source"] == "stderr" and attributes["openbot.log_type"] == nil and severity_text == "Info" and IsString(body) and not IsMatch(body, "(^\\s*(LOG|WARNING|WARN|ERROR|ERRO|FATAL|PANIC|INFO)(:|\\s)|\\blevel=(debug|info|notice|warn|warning|error)\\b)")
          - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "Info"
          - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "Warn"
          - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "Error"
          - set(attributes["request_id"], cache["data"]["requestId"])
            where IsString(cache["data"]["requestId"]) and IsMatch(cache["data"]["requestId"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - set(attributes["request_id"], cache["data"]["request_id"])
            where attributes["request_id"] == nil and IsString(cache["data"]["request_id"]) and IsMatch(cache["data"]["request_id"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - set(attributes["run_id"], cache["data"]["runId"])
            where IsString(cache["data"]["runId"]) and IsMatch(cache["data"]["runId"], "(?i)^(routine_run_)?[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - set(attributes["run_id"], cache["data"]["run_id"])
            where attributes["run_id"] == nil and IsString(cache["data"]["run_id"]) and IsMatch(cache["data"]["run_id"], "(?i)^(routine_run_)?[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          # The routine runner names the same id `routineRunId` at its call sites; the guard is
          # identical, so a run id only ever reaches OpenObserve in the shape its producer uses.
          - set(attributes["run_id"], cache["data"]["routineRunId"])
            where attributes["run_id"] == nil and IsString(cache["data"]["routineRunId"]) and IsMatch(cache["data"]["routineRunId"], "(?i)^(routine_run_)?[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - keep_keys(attributes, ["openbot.log_type", "request_id", "run_id"])
          - set(body, "Runtime log. Inspect local logs for details.")
          - set(body, attributes["openbot.log_type"]) where IsString(attributes["openbot.log_type"])

  transform/audit:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          - keep_keys(resource.attributes, [])
          - keep_keys(scope.attributes, [])
          - set(scope.name, "openbot.audit")
          - set(scope.version, "")
          - set(resource.attributes["service.name"], "server")
          - set(resource.attributes["deployment.environment"], "${env:OO_ENVIRONMENT_LABEL}")
          - set(resource.attributes["log_class"], "audit")
          - set(attributes["request_id"], attributes["openbot.payload.requestId"])
            where IsString(attributes["openbot.payload.requestId"]) and IsMatch(attributes["openbot.payload.requestId"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - delete_key(attributes, "request_id")
            where not IsString(attributes["request_id"]) or not IsMatch(attributes["request_id"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - set(attributes["run_id"], attributes["openbot.payload.runId"])
            where IsString(attributes["openbot.payload.runId"]) and IsMatch(attributes["openbot.payload.runId"], "(?i)^(routine_run_)?[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - delete_key(attributes, "run_id")
            where not IsString(attributes["run_id"]) or not IsMatch(attributes["run_id"], "(?i)^(routine_run_)?[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - keep_keys(attributes, ["openbot.event_type", "openbot.target_type", "openbot.target_id", "openbot.actor_user_id", "openbot.initiator_kind", "openbot.initiator_id", "request_id", "run_id"])
          - delete_key(attributes, "openbot.event_type")
            where not IsString(attributes["openbot.event_type"]) or not IsMatch(attributes["openbot.event_type"], "^(configuration\\.changed|credential\\.created|credential\\.rotated|credential\\.rotation_refused|credential\\.revoked|channel\\.routed|delivery\\.received|delivery\\.sent|delivery\\.opted_out|delivery\\.failed|channel\\.deleted|agent\\.dial_refused|agent\\.stream_stalled|agent\\.tool_limit_refused|mcp\\.tools_discovered|mcp\\.call_succeeded|mcp\\.call_rejected|mcp\\.call_failed|mcp\\.callback_refused|mcp\\.oauth_client_registered|mcp\\.oauth_client_read_failed|mcp\\.connection_verified|mcp\\.account_connected|mcp\\.authorization_unreconciled|mcp\\.account_disconnected|mcp\\.authorization_cancelled|mcp\\.cancelled_grant_left_live|mcp\\.account_mode_changed|shared_use\\.requested|shared_use\\.approved|shared_use\\.declined|shared_use\\.owner_approved|shared_use\\.owner_withdrawn|app_access\\.requested|app_access\\.cancelled|app_access\\.approved|app_access\\.dismissed|app_access\\.refused|app_access\\.owner_granted|app_access\\.owner_revoked|plugin\\.grants_translated|plugin\\.grants_changed|computer\\.action_allowed|computer\\.action_refused|computer\\.action_failed|computer\\.action_stopped|computer\\.help_requested|computer\\.help_cancelled|computer\\.control_taken|computer\\.control_released|computer\\.secret_requested|computer\\.secret_supplied|computer\\.sign_in_requested|computer\\.sign_in_code_requested|computer\\.sign_in_completed|computer\\.sign_in_failed|computer\\.sign_in_cancelled|password\\.saved|password\\.deleted|computer\\.stopped|computer\\.reset|computer\\.browser_cleared|computer\\.updated|computer\\.policy_loaded|computer\\.policy_changed|computer\\.policy_translated|computer\\.isolation_loaded|bot\\.declined|component\\.granted|component\\.revoked|component\\.published|component\\.unpublished|component\\.draft_saved|component\\.description_updated|component\\.refused|component\\.function_granted|component\\.function_revoked|component\\.function_called|component\\.function_refused|component\\.function_failed|person\\.role_changed|person\\.access_revoked|person\\.access_restored|audit\\.exported|audit\\.asked|what_if\\.asked|what_if\\.checked|session\\.signed_in|session\\.refused|person\\.admin_by_configuration|t01\\.login_initialized|identity_provider\\.registered|identity_provider\\.removed|bot\\.created|bot\\.updated|bot\\.duplicated|bot\\.hidden|bot\\.unhidden|bot\\.pinned|bot\\.unpinned|bot\\.deleted|bot\\.callback_token_issued|bot\\.callback_token_revoked|bot\\.isolation_refused|bot\\.paused|bot\\.resumed|bot\\.reset|bot\\.notifications_changed|bot\\.follow_up_scheduled|bot\\.follow_up_cancelled|bot\\.handoff_stopped|agent\\.handoff_offered|agent\\.handoff_refused|agent\\.handoff_delivered|agent\\.handoff_failed|agent\\.handoff_retried|agent\\.escalated|agent\\.escalation_failed|routines\\.dispatch_refused|routines\\.run_requested|routines\\.run_cancelled|responsibility\\.triggered|approval\\.evaluated|approval\\.person_decided|approval\\.withdrawn|approval\\.rule_changed|approval\\.settings_changed|approval\\.rules_translated|approval\\.guidance_changed|capability\\.changed|capability\\.changes_translated|enterprise\\.setting_changed|auth\\.sessions_revoked|network_policy\\.changed|network_policy\\.removed|network_policy\\.translated|session\\.break_glass|person\\.provisioned|person\\.deprovisioned|person\\.reprovisioned|computer\\.terminated|computer\\.terminated_inactive|delivery\\.linked|delivery\\.unlinked|identity\\.linked|identity\\.unlinked|identity\\.link_retired|routine\\.created|routine\\.updated|routine\\.deleted|routine\\.enabled_changed|model\\.refused|recorder\\.bearer_refused|recorder\\.connected|recorder\\.connect_refused|recorder\\.revoked|recorder\\.sign_out_failed|recorder\\.trajectory_refused|learning\\.sharing_changed|learning\\.skill_opened|learning\\.skill_closed|learning\\.sharing_requested|learning\\.sharing_decided)$")
          - delete_key(attributes, "openbot.target_type")
            where not IsString(attributes["openbot.target_type"]) or not IsMatch(attributes["openbot.target_type"], "^(agent|app|bot|computer|configuration|conversation|credential|deployment|mcp_tool|organization|person|routine|run|setting|settings|skill|user|workspace)$")
          - delete_key(attributes, "openbot.initiator_kind")
            where not IsString(attributes["openbot.initiator_kind"]) or not IsMatch(attributes["openbot.initiator_kind"], "^(person|bot|deployment)$")
          - delete_key(attributes, "openbot.target_id")
            where not IsString(attributes["openbot.target_id"]) or not IsMatch(attributes["openbot.target_id"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - delete_key(attributes, "openbot.actor_user_id")
            where not IsString(attributes["openbot.actor_user_id"]) or not IsMatch(attributes["openbot.actor_user_id"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - delete_key(attributes, "openbot.initiator_id")
            where not IsString(attributes["openbot.initiator_id"]) or not IsMatch(attributes["openbot.initiator_id"], "(?i)^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$")
          - set(event_name, "")
          - set(body, "OpenBot audit event")
          - set(body, attributes["openbot.event_type"]) where IsString(attributes["openbot.event_type"])
          - set(severity_text, "Info") where severity_number < SEVERITY_NUMBER_WARN
          - set(severity_text, "Warn") where severity_number >= SEVERITY_NUMBER_WARN and severity_number < SEVERITY_NUMBER_ERROR
          - set(severity_text, "Error") where severity_number >= SEVERITY_NUMBER_ERROR

  batch:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 256

exporters:
  # Runtime and audit land in separate streams, so the deployment can keep the runtime copy for
  # 30 days and the audit copy for 90 (see the runbook's retention step). The stream-name header
  # is how OpenObserve's OTLP endpoint picks the stream; everything else about the two exporters
  # is the same, including the bounded queue and the single shared ingestion token.
  otlphttp/runtime:
    endpoint: ${env:OO_INGEST_ENDPOINT}
    headers:
      Authorization: Basic ${env:OO_INGEST_BASIC}
      stream-name: openbot_runtime
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 512
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      max_elapsed_time: 1h
  otlphttp/audit:
    endpoint: ${env:OO_INGEST_ENDPOINT}
    headers:
      Authorization: Basic ${env:OO_INGEST_BASIC}
      stream-name: openbot_audit
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 512
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      max_elapsed_time: 1h
  file/payload:
    path: /var/lib/otelcol/sent-payload.json
    rotation:
      max_megabytes: 10
      max_days: 1
      max_backups: 1

service:
  extensions: [file_storage/queue]
  pipelines:
    logs/runtime:
      receivers: [fluent_forward/runtime]
      processors: [memory_limiter, filter/runtime, groupbyattrs/runtime, transform/runtime, batch]
      exporters: [otlphttp/runtime, file/payload]
    logs/audit:
      receivers: [otlp/audit]
      processors: [memory_limiter, transform/audit, batch]
      exporters: [otlphttp/audit, file/payload]
