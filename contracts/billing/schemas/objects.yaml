    OutboxRecord:
      type: object
      description: >-
        Transactionally-committed outbound metering record (committed in the
        same atomic transaction as balances, ledger entries and idempotency
        rows; network calls happen outside transactions). Watermarks advance
        only after confirmed delivery; reconciliation uses fixed watermark +
        expected ID-set comparison over full-page rescans.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - aggregate_type
        - aggregate_id
        - event_type
        - dedupe_key
        - watermark_seq
        - attempt_count
        - published_at_us
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        aggregate_type:
          type: string
          enum: [usage_event, metering_relationship]
        aggregate_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        event_type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
        dedupe_key:
          type: string
          description: Stable source id; Lago-side dedupe anchor (channel callbacks use channel message/transaction ids instead).
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        watermark_seq:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        attempt_count:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        published_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
        status:
          type: string
          enum: [pending, sent, failed]
          description: pending -> sent after confirmed publish; failed keeps retrying; recovery after crash resumes from the watermark without duplicates.
      examples:
        - id: "f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000301000000"
          updated_at_us: "1700000302000000"
          revision: "1"
          aggregate_type: usage_event
          aggregate_id: "e4f5a6b7-c8d9-4e0f-9a1b-2c3d4e5f6a7b"
          event_type: usage.settled
          dedupe_key: "evt_settle_call_9f8e7d6c"
          watermark_seq: "1043"
          attempt_count: "0"
          published_at_us: null
          status: pending

    # ------------------------------------------------------- catalog versions
    # (#65): versioned products, quotas, prices, run caps and the immutable
    # release bundle that binds them. Business content is append-only; a
    # retired version stops NEW selection but stays resolvable forever for
    # historical quotes, pinned steps and orders.
    BillingProductVersion:
      type: object
      description: >-
        One sellable product version. monthly_plan: exactly one calendar month
        per period, references its subscription quota version, and may grant
        null credits (a rights-only tier). credit_pack: long-lived, no monthly
        validity, always grants a positive microcredit amount. price_fen is
        CNY integer fen — never implicitly converted to credits. Test numbers
        live in releases marked environment=test and are never production
        sale prices.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - environment
        - product_id
        - product_type
        - display_name
        - price_fen
        - currency
        - granted_microcredits
        - period_months
        - quota_version_id
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
          description: null for organization-global products.
        environment:
          $ref: "#/components/schemas/BillingEnvironment"
        product_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        product_type:
          type: string
          enum: [monthly_plan, credit_pack]
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        price_fen:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Fen"
        currency:
          $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
        granted_microcredits:
          $ref: "./scalars.yaml#/components/schemas/MicrocreditsNullable"
          description: Null for rights-only monthly plans; positive for credit packs.
        period_months:
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64Nullable"
          description: Exactly 1 for monthly plans; null for long-lived credit packs.
        quota_version_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
          description: Referenced subscription quota version; required for monthly plans.
        status:
          type: string
          enum: [draft, active, retired]
      x-immutability: append-only
      examples:
        - id: "aa000000-0000-4000-8000-000000000001"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: null
          environment: production
          product_id: "pack_1m_credits"
          product_type: credit_pack
          display_name: "1M credits pack"
          price_fen: "9900"
          currency: CNY
          granted_microcredits: "1000000"
          period_months: null
          quota_version_id: null
          status: active

    BillingQuotaVersion:
      type: object
      description: >-
        Entitlement limits of one tier (basic or subscription). Quota resource
        keys are a CLOSED set — a key outside it is a schema violation, never
        extra configuration. Quotas are NOT balance: a subscription stays
        valid regardless of credit exhaustion.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - environment
        - tier
        - quotas
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
        environment:
          $ref: "#/components/schemas/BillingEnvironment"
        tier:
          type: string
          enum: [basic, subscription]
        quotas:
          type: array
          minItems: 1
          items:
            type: object
            required: [resource_key, limit, unit]
            additionalProperties: false
            properties:
              resource_key:
                type: string
                enum: [concurrent_runs, automatic_task_seats]
              limit:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
                description: Non-negative integer limit of the key's unit.
              unit:
                type: string
                const: count
        status:
          type: string
          enum: [draft, active, retired]
      x-immutability: append-only
      examples:
        - id: "aa000000-0000-4000-8000-000000000002"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: null
          environment: production
          tier: subscription
          quotas:
            - resource_key: concurrent_runs
              limit: "5"
              unit: count
            - resource_key: automatic_task_seats
              limit: "20"
              unit: count
          status: active

    BillingRunCapVersion:
      type: object
      description: >-
        Default root-run ceiling in whole microcredits. A new Run pins this
        value at creation; later repricing or tier changes never widen an
        existing Run's cap. Every PriceVersion references exactly one of these
        and must embed the SAME value — divergence is a configuration error.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - environment
        - cap_microcredits
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
        environment:
          $ref: "#/components/schemas/BillingEnvironment"
        cap_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
        status:
          type: string
          enum: [draft, active, retired]
      x-immutability: append-only
      examples:
        - id: "aa000000-0000-4000-8000-000000000003"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: null
          environment: production
          cap_microcredits: "5000000"
          status: active

    BillingEnvironment:
      type: string
      description: Configuration environment. A production request NEVER selects a test release; test_only configurations exist only for acceptance runs.
      enum: [production, test]
      examples: ["production"]

    BillingCatalogRelease:
      type: object
      description: >-
        One immutable bundle binding product versions to their pinned price,
        quota and run-cap versions for a scope, environment and half-open
        [effective_from_us, effective_to_us) interval. content_digest covers
        the referenced versions' business content and is echoed by every
        quote. Selection at quote time uses the server's trusted clock; an
        account-specific release wins over the organization-global one, and an
        unavailable account-specific catalog fails the quote CLOSED instead of
        falling back to the generic release.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - environment
        - effective_from_us
        - effective_to_us
        - content_digest
        - basic_quota_version_id
        - status
        - items
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
        environment:
          $ref: "#/components/schemas/BillingEnvironment"
        effective_from_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        effective_to_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
        content_digest:
          type: string
          minLength: 64
          maxLength: 128
          pattern: "^[0-9a-f]{64,128}$"
          description: SHA-256 over the sorted referenced-version content, INCLUDING the basic quota below.
        basic_quota_version_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
          description: The release-level BASIC-tier quota version (base resource ceilings of the scope); null only for releases created before the binding existed, which selection refuses as incomplete.
        status:
          type: string
          enum: [draft, active, retired]
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_version_id, price_version_id, quota_version_id, run_cap_version_id]
            additionalProperties: false
            properties:
              product_version_id:
                $ref: "./scalars.yaml#/components/schemas/Uuid"
              price_version_id:
                $ref: "./scalars.yaml#/components/schemas/Uuid"
                description: The price version PINNED for this product by the release.
              quota_version_id:
                $ref: "./scalars.yaml#/components/schemas/UuidNullable"
              run_cap_version_id:
                $ref: "./scalars.yaml#/components/schemas/Uuid"
      x-immutability: append-only
      examples:
        - id: "aa000000-0000-4000-8000-000000000004"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: null
          environment: production
          effective_from_us: "1700000000000000"
          effective_to_us: null
          content_digest: "5f1bfe13c9be43bab4a1e12bfa5a4e19c1be90b3ba5a1e1d0b2c3d4e5f607182"
          status: active
          items:
            - product_version_id: "aa000000-0000-4000-8000-000000000001"
              price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
              quota_version_id: null
              run_cap_version_id: "aa000000-0000-4000-8000-000000000003"

    SellabilityReason:
      type: string
      description: Closed reasons a product quote answers sellable=false. Absence of a complete production release NEVER degrades to a zero price or a demo value.
      enum:
        - no_published_release
        - account_release_unavailable
        - ambiguous_release_configuration
        - release_incomplete
        - product_not_in_release
        - quota_version_missing
      examples: ["no_published_release"]

    EligibilityReason:
      type: string
      description: Closed outcome reasons of the purchase-eligibility table (R5/R6).
      enum:
        - eligible
        - already_prepaid
        - refund_required
        - refund_pending
        - refund_outcome_unknown
        - state_conflict
      examples: ["eligible"]

    EligibilityNextAction:
      type: string
      description: Closed next-step the caller should take after an eligibility outcome.
      enum:
        - create_order
        - refund_existing_prepurchase_first
        - wait_for_refund_outcome
        - keep_existing_commitment
        - recheck_state
      examples: ["create_order"]

    PurchaseEligibility:
      type: object
      description: >-
        Observable result of the eligibility table over a TRUSTED state
        snapshot (subscription + prepaid commitment + refund facts), carrying
        the snapshot revision the order service must recheck inside the
        purchase transaction. A quote never occupies eligibility; concurrent
        purchase safety is enforced by the order service's transaction, not by
        this read.
      required:
        - allowed
        - reason
        - next_action
        - target_period
        - state_revision
        - existing_commitment
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        reason:
          $ref: "#/components/schemas/EligibilityReason"
        next_action:
          $ref: "#/components/schemas/EligibilityNextAction"
        target_period:
          oneOf:
            - type: "null"
            - type: object
              required: [index, start_us, end_us]
              additionalProperties: false
              properties:
                index:
                  type: string
                  $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
                start_us:
                  $ref: "./scalars.yaml#/components/schemas/TimestampUs"
                end_us:
                  $ref: "./scalars.yaml#/components/schemas/TimestampUs"
              description: >-
                The period this purchase would take effect for. Null for a
                fresh/expired purchase: the anchor is set at ACTUAL activation,
                never at payment time.
        state_revision:
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        existing_commitment:
          oneOf:
            - type: "null"
            - type: object
              required: [product_id, target_period_start_us]
              additionalProperties: false
              properties:
                product_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9._:-]{1,128}$"
                target_period_start_us:
                  $ref: "./scalars.yaml#/components/schemas/TimestampUs"
      examples:
        - allowed: true
          reason: eligible
          next_action: create_order
          target_period:
            index: "1"
            start_us: "1709170215123456"
            end_us: "1711848615123456"
          state_revision: "7"
          existing_commitment: null

    LocalWallTime:
      type: object
      description: Asia/Shanghai wall-time fields. microsecond is kept separately from the millisecond-resolution conversion so no sub-second precision is ever lost.
      required: [year, month, day, hour, minute, second, microsecond]
      additionalProperties: false
      properties:
        year:
          type: integer
          format: int32
          minimum: 1970
          maximum: 9999
        month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
        hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
        minute:
          type: integer
          format: int32
          minimum: 0
          maximum: 59
        second:
          type: integer
          format: int32
          minimum: 0
          maximum: 59
        microsecond:
          type: integer
          format: int32
          minimum: 0
          maximum: 999999
      examples:
        - year: 2024
          month: 1
          day: 31
          hour: 9
          minute: 30
          second: 15
          microsecond: 123456

    MonthPeriodDescriptor:
      type: object
      description: >-
        One half-open period [B(n), B(n+1)) derived from the ORIGINAL
        activation anchor: month ends clamp (Jan 31 -> Feb 29/28) and the
        original day number RESUMES afterwards. Boundaries are integer UTC
        microseconds; an event at exactly end_us belongs to the NEXT period
        and the boundary is never rewritten by subtracting time.
      required:
        - index
        - start_us
        - end_us
        - start_iso
        - end_iso
        - start_local
        - end_local
      additionalProperties: false
      properties:
        index:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        start_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        end_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        start_iso:
          type: string
          minLength: 20
          maxLength: 40
        end_iso:
          type: string
          minLength: 20
          maxLength: 40
        start_local:
          $ref: "#/components/schemas/LocalWallTime"
        end_local:
          $ref: "#/components/schemas/LocalWallTime"
      examples:
        - index: "0"
          start_us: "1706679015123456"
          end_us: "1709170215123456"
