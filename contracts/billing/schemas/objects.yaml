# billing contract — core and supplementary object contracts
# (authoritative; referenced from openapi.yaml)
#
# State machines: JSON Schema can enumerate the states but cannot enforce
# transitions. The legal transitions below are enforced by the contract semantic
# checker (fixtures) and, at run time, by the ledger implementation (#64/#66).
# Terminal states are never left.
components:
  schemas:
    ResourceKind:
      type: string
      description: Metered resource kinds priced by a PriceVersion. The list is closed; new resources require a contract change.
      enum:
        - model_input_tokens
        - model_output_tokens
        - model_cache_read_tokens
        - model_cache_write_tokens
        - model_web_search_requests
        - model_request_count
      examples: ["model_input_tokens"]

    # ---------------------------------------------------------------- account
    BillingAccount:
      type: object
      description: >-
        Personal payment account. Exactly one active personal payment account
        exists per stable personal identity (owner_subject_id). The owner is
        resolved server-side from the stable subject id and the Personal
        Workspace relation; it is never derived from email, deployer, bot
        creator, or client-submitted payer claims. Status changes to suspended
        or closed stop NEW consumption while in-flight reservations and
        settlements continue to be processed. currency is fixed CNY. Balance
        fields are the account-level projection of credit lots and are never
        allowed to go negative.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - owner_subject_id
        - personal_workspace_id
        - currency
        - available_microcredits
        - reserved_microcredits
        - refund_frozen_microcredits
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Equals id — the account is its own billing account.
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        owner_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
        personal_workspace_id:
          type: string
          description: Personal Workspace relation this account is derived from.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        currency:
          $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
        available_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        reserved_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        refund_frozen_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        status:
          type: string
          enum: [active, suspended, closed]
          description: active -> suspended -> active; active|suspended -> closed (terminal). closed never reopens.
      examples:
        - id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000000000000"
          updated_at_us: "1700000100000000"
          revision: "3"
          owner_subject_id: "subj_01hx8z3k2m"
          personal_workspace_id: "ws_01hx8z3k2m"
          currency: CNY
          available_microcredits: "600000"
          reserved_microcredits: "200000"
          refund_frozen_microcredits: "50000"
          status: active

    # ------------------------------------------------------------------- lots
    CreditLot:
      type: object
      description: >-
        One granted bucket of credits with its own lifecycle. Conservation
        invariant (enforced by the contract semantic checker and, at run time,
        by the ledger): granted_microcredits = available_microcredits +
        reserved_microcredits + refund_frozen_microcredits + consumed_microcredits
        + expired_microcredits + revoked_microcredits, every term non-negative.
        Consumption order: nearest expiry first, then long-lived lots last; ties
        broken by (created_at_us, id). released-after-expiry amounts move to
        expired_microcredits, never back to available. frozen status means part
        of the lot is refund-frozen, not that the whole lot is unusable.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - source_type
        - source_event_id
        - source_period_id
        - granted_microcredits
        - available_microcredits
        - reserved_microcredits
        - refund_frozen_microcredits
        - consumed_microcredits
        - expired_microcredits
        - revoked_microcredits
        - valid_from_us
        - expires_at_us
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        source_type:
          type: string
          enum: [subscription, pack, compensation]
          description: subscription = monthly plan grant; pack = long-lived credit pack; compensation = platform compensation lot (from an expired subscription source it is valid for 30 days after grant).
        source_event_id:
          type: string
          description: Stable id of the originating purchase/compensation event; idempotent re-grants dedupe on it.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        source_period_id:
          type: ["string", "null"]
          description: Billing period the grant belongs to; null for period-less packs.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        granted_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        available_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        reserved_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        refund_frozen_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        consumed_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        expired_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        revoked_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        valid_from_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        expires_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
          description: Absolute expiry instant; null for long-lived packs. Packs are long-lived; subscription grants expire with the period.
        status:
          type: string
          enum: [scheduled, active, frozen, exhausted, expired, revoked]
          description: >-
            scheduled -> active at valid_from_us (before that the available
            part is NOT counted in the account's spendable balance). active ->
            exhausted when available+reserved+refund_frozen reach 0. active ->
            expired at expires_at_us, where ONLY the remaining available
            moves to expired; reserved and refund_frozen are PRESERVED in
            flight for the later settlement/refund step (#66/#71) and are
            never dropped or revived by expiry — a release arriving after
            expiry moves its amount to expired, never back to available.
            active/frozen -> revoked on revocation (terminal). frozen is a
            partial marker and returns to the pre-freeze state when the freeze
            is lifted. status is an auxiliary projection: spendability is
            always computed from valid_from_us/expires_at_us AND the
            components together.
      examples:
        - id: "3b4c5d6e-7f80-4a9b-8c1d-2e3f4a5b6c7d"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000000000000"
          updated_at_us: "1700000200000000"
          revision: "4"
          source_type: subscription
          source_event_id: "evt_sub_2026M11_grant"
          source_period_id: "period_2026-11"
          granted_microcredits: "1000000"
          available_microcredits: "600000"
          reserved_microcredits: "200000"
          refund_frozen_microcredits: "50000"
          consumed_microcredits: "100000"
          expired_microcredits: "30000"
          revoked_microcredits: "20000"
          valid_from_us: "1700000000000000"
          expires_at_us: "1702512000000000"
          status: active

    # ----------------------------------------------------------- reservations
    Reservation:
      type: object
      description: >-
        Reserve-first hold on credits for one execution step. Created ONLY by a
        trusted execution service through the internal API after the server
        re-verifies the payer authorization; the browser can never create or
        report one. Links the call to payer, bot, budget and price snapshot.
        max_cost_microcredits must cover the enforceable worst case of the
        step; a step whose cost cannot be bounded is rejected (unbounded_cost).
        unknown_usage_deadline_us = reserved_at_us + 24h at most, never extended
        by retries or status changes; when the deadline passes with unknown
        usage the reservation is released and late costs are platform-borne.
        Reservation, settlement and release race on the same atomic terminal
        transition — the successful committer wins.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - root_run_id
        - run_id
        - step_id
        - call_id
        - bot_id
        - payer_authorization_id
        - price_version_id
        - max_cost_microcredits
        - allocations
        - reserved_at_us
        - unknown_usage_deadline_us
        - usage_status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        root_run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Root Run whose RootRunBudget caps this reservation; all child runs, delegations and subagents share the same payer and cap.
        run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        step_id:
          type: string
          description: Execution step that reserves the credits.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        call_id:
          type: ["string", "null"]
          description: One actual model invocation; null for reservations of non-model steps. Exactly one reservation per call_id — stream fragments never accumulate twice.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        bot_id:
          type: string
          description: Executing bot context (#32). Required for every reservation; never used to derive the payer.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        payer_authorization_id:
          type: string
          description: Server-verified payer authorization reference; the payer is fixed at reservation time and inherited by the whole child chain.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        price_version_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Price version snapshot locked at reserve time; later price changes do not affect this step.
        max_cost_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
          description: Enforceable upper bound of the step cost; allocations total must not exceed it.
        allocations:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Allocation"
          minItems: 1
          description: Credit-lot splits (nearest expiry first). Sum of allocations == amounts held from available at reserve time.
        reserved_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        unknown_usage_deadline_us:
          type: string
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: reserved_at_us + at most 24h. At the deadline unknown usage is released; after the deadline no NEW user charge may be created for this reservation.
        usage_status:
          type: string
          enum: [reserved, awaiting_usage, settled, released]
          description: >-
            reserved -> awaiting_usage (request dispatched); reserved ->
            settled|released directly (cancel / immediate settle);
            awaiting_usage -> settled|released. settled and released are
            terminal and immutable; a terminal state is never re-entered or
            changed. Release after the deadline and settle race on the same
            atomic terminal condition.
      examples:
        - id: "4c5d6e7f-8091-4a0b-9c2d-3e4f5a6b7c8d"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000300000000"
          updated_at_us: "1700000300000000"
          revision: "1"
          root_run_id: "5d6e7f80-91a2-4b1c-8d3e-4f5a6b7c8d9e"
          run_id: "6e7f8091-a2b3-4c2d-9e4f-5a6b7c8d9e0f"
          step_id: "step_0007"
          call_id: "call_9f8e7d6c"
          bot_id: "bot_01hx"
          payer_authorization_id: "auth_01hx8z3k2m"
          price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          max_cost_microcredits: "200000"
          allocations:
            - lot_id: "3b4c5d6e-7f80-4a9b-8c1d-2e3f4a5b6c7d"
              amount_microcredits: "150000"
            - lot_id: "7f8091a2-b3c4-4d5e-8f6a-7b8c9d0e1f2a"
              amount_microcredits: "50000"
          reserved_at_us: "1700000300000000"
          unknown_usage_deadline_us: "1700086700000000"
          usage_status: reserved

    # ------------------------------------------------------------- settlement
    Settlement:
      type: object
      description: >-
        Immutable final settlement of exactly one reservation (business-unique
        constraint on reservation_id, independent of any HTTP idempotency key).
        posted is terminal; late-arriving usage after posting produces appended
        attribution records / Adjustments, never a rewritten settlement. Usage
        is reported by the trusted settlement service only — browser self-reports
        are never accepted. charged goes to consumed in the allocated lots;
        the unused remainder is released back to available (or to expired if the
        lot expired in the meantime). Actual cost above max_cost_microcredits is
        platform-borne and never creates a user negative balance or post-hoc
        recovery. Cancellation settles only valid consumption that actually
        happened; platform faults and duplicate execution are platform-borne;
        self-paid models charge no platform credits.
      allOf:
        - $ref: "./common.yaml#/components/schemas/CommonFields"
        - type: object
          required:
            - reservation_id
            - source_event_id
            - usage_items
            - charged_microcredits
            - released_microcredits
            - platform_cost_microcredits
            - cost_bearer
            - occurred_at_us
            - settled_at_us
            - source_period_ids
            - price_version_id
            - status
          properties:
            reservation_id:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            source_event_id:
              type: string
              description: Stable settlement source event; idempotency anchor for re-delivered settlement requests.
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              x-not-personal-identity: true
            usage_items:
              type: array
              items:
                $ref: "./common.yaml#/components/schemas/UsageItem"
              description: Exact usage lines; each item carries the locked price_version_id.
            charged_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
              description: Total charged to the user (HALF_UP over the sum of all resource costs, not per item).
            released_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            platform_cost_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
              description: Overage and platform-fault consumption borne by the platform.
            cost_bearer:
              $ref: "./scalars.yaml#/components/schemas/CostBearer"
            occurred_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
              description: When the usage actually happened; preserved verbatim for Lago timestamp generation and late-event period attribution.
            settled_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            source_period_ids:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 128
              minItems: 1
              description: Original billing period(s) the usage is attributed to; late events stay in their original period.
            price_version_id:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            status:
              type: string
              enum: [posted]
              description: Terminal and immutable.
      unevaluatedProperties: false
      x-immutability: append-only

    # ------------------------------------------------------------- adjustment
    Adjustment:
      type: object
      description: >-
        Immutable appended correction to the ledger. Business uniqueness scope =
        (billing_account_id, original_event_id, adjustment_type): the same scope
        cannot be duplicated even with a different HTTP idempotency key. Any
        legitimate follow-up correction must carry its own distinct source
        event id and explicit linkage. Sign semantics are ledger balance
        semantics: a POSITIVE delta increases consumable entitlement — it
        restores the original deduction's consumed allocations back to
        available in the original lots, or creates a CompensationLot when the
        original source is an expired subscription (valid for 30 days after
        grant) — recorded in compensation_lot_id. A NEGATIVE delta withdraws
        revocable available credits of the original event's lots into revoked
        and never drives anything negative or chases reserved/consumed/frozen
        credits. actor_subject_id records the audited human or service
        operator.
      allOf:
        - $ref: "./common.yaml#/components/schemas/CommonFields"
        - type: object
          required:
            - original_event_id
            - adjustment_type
            - source_event_id
            - signed_delta_microcredits
            - reason
            - actor_subject_id
            - original_period_id
            - effective_at_us
            - compensation_lot_id
            - status
          properties:
            original_event_id:
              type: string
              description: Ledger event being corrected.
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              x-not-personal-identity: true
            adjustment_type:
              type: string
              enum: [charge_correction, compensation, late_usage_attribution, expiry_correction, revocation]
              description: Closed set; late_usage_attribution appends ownership for usage found after settlement without rewriting it.
            source_event_id:
              type: string
              description: Distinct source event of THIS correction.
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              x-not-personal-identity: true
            signed_delta_microcredits:
              $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
            reason:
              type: string
              minLength: 1
              maxLength: 512
            actor_subject_id:
              $ref: "./scalars.yaml#/components/schemas/SubjectId"
              description: Audited operator (authorized operations / compensation service), not the payer.
            original_period_id:
              type: ["string", "null"]
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              description: Adjustment stays attributed to the ORIGINAL period of the referenced event; null when that source has no period (pack); never invented.
            effective_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            compensation_lot_id:
              $ref: "./scalars.yaml#/components/schemas/UuidNullable"
              description: Compensation lot created/extended by a positive delta; null when the adjustment does not create one.
            status:
              type: string
              enum: [posted]
              description: Terminal and immutable.
        - if:
            properties:
              signed_delta_microcredits:
                pattern: "^-"
            required: [signed_delta_microcredits]
          then:
            properties:
              compensation_lot_id:
                type: "null"
            description: >-
              A negative delta withdraws entitlement; it never creates or
              extends a CompensationLot — compensation_lot_id is null and an
              over-wide negative is refused with 409 state_conflict, never a
              negative balance.
      unevaluatedProperties: false
      x-immutability: append-only

    # ------------------------------------------------------------------ order
    Order:
      type: object
      description: >-
        Purchase order for a priced product. Created by the account owner only
        (organization membership alone is NOT sufficient to pay); unit price and
        payer are never accepted from the client — amount_fen comes from the
        product snapshot of the referenced PriceVersion. Orders expire after 30
        minutes; refreshing the payment link does NOT extend the order. Payment
        that verifiably happened within the validity window is still fulfilled;
        expired payment, duplicate collection and dual-channel success go to
        exception refund handling. Refund progress is aggregated separately and
        never overwrites the fact that payment arrived. Order, payment attempt
        and fulfillment identities are independent; after a crash+restart the
        order is fulfilled exactly once.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - purchaser_subject_id
        - product_id
        - product_type
        - product_snapshot
        - price_version_id
        - amount_fen
        - currency
        - expires_at_us
        - fulfillment_event_id
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        purchaser_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
        product_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        product_type:
          type: string
          enum: [subscription_monthly, credit_pack]
        product_snapshot:
          type: object
          description: Immutable snapshot of what is being bought (no client-supplied price).
          required: [product_id, product_type, granted_microcredits, period_months, display_name, price_version_id]
          additionalProperties: false
          properties:
            product_id:
              type: string
              minLength: 1
              maxLength: 128
            product_type:
              type: string
              enum: [subscription_monthly, credit_pack]
            granted_microcredits:
              $ref: "./scalars.yaml#/components/schemas/MicrocreditsNullable"
              description: Credits granted by the product; null for subscription tiers that only grant rights.
            period_months:
              $ref: "./scalars.yaml#/components/schemas/UnsignedInt64Nullable"
              description: Subscription length in months; null for packs.
            display_name:
              type: string
              minLength: 1
              maxLength: 200
            price_version_id:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Uuid"
        price_version_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        amount_fen:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Fen"
        currency:
          $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
        expires_at_us:
          type: string
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: created_at_us + 30 minutes, never extended.
        fulfillment_event_id:
          type: ["string", "null"]
          description: Stable id of the single fulfillment event; null until fulfilled. Business-unique per order — exactly one fulfillment even across restarts.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        status:
          type: string
          enum: [pending, payment_confirming, paid, fulfilling, fulfilled, closing, closed, exception]
          description: >-
            pending -> payment_confirming -> paid -> fulfilling -> fulfilled;
            paid/fulfilling -> exception on anomaly (expired payment, duplicate
            collection, dual-channel success). pending -> closing -> closed at
            expiry after a final query. closed and exception never go back to
            paid states.
      examples:
        - id: "8d9e0f10-a1b2-4c3d-9e4f-6a7b8c9d0e1f"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000400000000"
          updated_at_us: "1700000500000000"
          revision: "5"
          purchaser_subject_id: "subj_01hx8z3k2m"
          product_id: "pack_1m_credits"
          product_type: credit_pack
          product_snapshot:
            product_id: "pack_1m_credits"
            product_type: credit_pack
            granted_microcredits: "1000000"
            period_months: null
            display_name: "1M credits pack"
            price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          amount_fen: "9900"
          currency: CNY
          expires_at_us: "1700002200000000"
          fulfillment_event_id: null
          status: paid

    # --------------------------------------------------------- payment attempt
    PaymentAttempt:
      type: object
      description: >-
        One payment attempt against one order; an order may have several
        attempts but only one fulfillment, and multiple succeeded attempts are
        an anomaly resolved by exception refunds. provider_transaction_id stays
        null until the channel confirms. verified_at_us is set only after the
        server-side adapter verifies the channel result — a user returning to
        the app NEVER proves payment. Channel identifiers are protocol facts,
        not personal identity.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - order_id
        - channel
        - merchant_reference
        - provider_transaction_id
        - protocol_version
        - amount_fen
        - currency
        - link_expires_at_us
        - provider_paid_at_us
        - verified_at_us
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        order_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        channel:
          $ref: "./scalars.yaml#/components/schemas/ChannelName"
        merchant_reference:
          type: string
          description: Outbound merchant order reference at the channel; dedupe anchor for channel callbacks.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        provider_transaction_id:
          type: ["string", "null"]
          description: Channel transaction id; null until confirmed. Business-unique per channel.
          minLength: 1
          maxLength: 128
          x-not-personal-identity: true
        protocol_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Channel protocol version the attempt was created with.
        amount_fen:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Fen"
        currency:
          $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
        link_expires_at_us:
          type: string
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: Payment-link validity; refreshing the link never extends the order expiry.
        provider_paid_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
        verified_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
          description: When the server verified the channel result; null while unknown.
        status:
          type: string
          enum: [created, pending, unknown, succeeded, failed, closed]
          description: >-
            created -> pending -> succeeded|failed|closed; pending/created ->
            unknown while the channel result is indeterminate; unknown ->
            succeeded|failed|closed after adapter verification. succeeded with a
            later second success on the same order raises an exception refund.
      examples:
        - id: "9e0f1a2b-c3d4-4e5f-8a6b-7c8d9e0f1a2b"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000450000000"
          updated_at_us: "1700000460000000"
          revision: "2"
          order_id: "8d9e0f10-a1b2-4c3d-9e4f-6a7b8c9d0e1f"
          channel: wechat
          merchant_reference: "mref_202611170001"
          provider_transaction_id: "wx_txn_4112233445"
          protocol_version: "v3"
          amount_fen: "9900"
          currency: CNY
          link_expires_at_us: "1700002250000000"
          provider_paid_at_us: "1700000460000000"
          verified_at_us: null
          status: unknown

    # ----------------------------------------------------------------- refund
    Refund:
      type: object
      description: >-
        Refund of an order. Regular full refunds apply only to unused credit
        packs and subscriptions whose current period has not started; approval
        atomically freezes the corresponding entitlements. Acceptance
        (requested) is NOT success; unknown provider state keeps the freeze;
        after 24h unresolved the case goes to a human and is NEVER
        auto-unfrozen. Success revokes the frozen amounts; explicit termination
        without refund unfreezes them, still respecting the original expiry.
        provider_refund_reference is business-unique per channel.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - order_id
        - payment_attempt_id
        - provider_refund_reference
        - amount_fen
        - frozen_allocations
        - reason
        - requested_by
        - reviewed_by
        - provider_result
        - resolved_at_us
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        order_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        payment_attempt_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        provider_refund_reference:
          type: ["string", "null"]
          description: Channel refund reference; null until submitted. Business-unique per channel.
          minLength: 1
          maxLength: 128
          x-not-personal-identity: true
        amount_fen:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Fen"
        frozen_allocations:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/FrozenAllocation"
          description: Entitlement freezes attached at approval; empty until then.
        reason:
          type: string
          minLength: 1
          maxLength: 512
        requested_by:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
        reviewed_by:
          $ref: "./scalars.yaml#/components/schemas/SubjectIdNullable"
          description: Reviewing operator; null until reviewed.
        provider_result:
          type: ["string", "null"]
          enum: [null, pending, succeeded, failed, unknown]
          description: Channel-side result; null before submission.
        resolved_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
          description: When the refund reached a decided outcome; null while open/unknown.
        status:
          type: string
          enum: [requested, rejected, approved, processing, unknown, succeeded, failed]
          description: >-
            requested -> approved (freeze atomically) -> processing ->
            succeeded|failed; requested -> rejected (no freeze);
            processing/unknown -> success/unknown channel states; unknown older
            than 24h escalates to manual review; unknown never auto-unfreezes.
      examples:
        - id: "a0b1c2d3-e4f5-4a6b-9c7d-8e9f0a1b2c3d"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700001000000000"
          updated_at_us: "1700001100000000"
          revision: "3"
          order_id: "8d9e0f10-a1b2-4c3d-9e4f-6a7b8c9d0e1f"
          payment_attempt_id: "9e0f1a2b-c3d4-4e5f-8a6b-7c8d9e0f1a2b"
          provider_refund_reference: "wx_ref_99887766"
          amount_fen: "9900"
          frozen_allocations:
            - lot_id: "3b4c5d6e-7f80-4a9b-8c1d-2e3f4a5b6c7d"
              amount_microcredits: "500000"
          reason: "unused credit pack"
          requested_by: "subj_01hx8z3k2m"
          reviewed_by: "subj_op_771"
          provider_result: pending
          resolved_at_us: null
          status: processing

    # ------------------------------------------------- metering relationship
    MeteringRelationship:
      type: object
      description: >-
        Per-account continuous metering link into Lago community edition
        v1.57.0. Independent of any monthly subscription: a relationship does
        NOT end when a subscription expires, only when the account stops
        metering. Lago plans used here are zero-amount mirrors (zero fixed fee,
        zero resource rates) so Lago aggregates nonzero resource usage and
        charged microcredits without ever producing a CNY receivable or a
        second deduction. Only metering-necessary fields are synced — never
        conversations, outputs or personal keys.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - external_customer_id
        - external_subscription_id
        - started_at_us
        - ended_at_us
        - meter_schema_version
        - last_outbox_watermark
        - sync_status
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        external_customer_id:
          type: string
          description: Lago external_customer_id, derived deterministically from the billing account.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        external_subscription_id:
          type: string
          description: Lago external_subscription_id of the zero-amount mirror subscription.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        started_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        ended_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
        meter_schema_version:
          type: string
          const: meter.v1
          description: Version of the metered-event schema shipped to Lago.
        last_outbox_watermark:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
          description: Fixed outbox watermark up to which events are known to be pushed; reconciliation re-scans full pages and compares ID SETS, never only totals.
        sync_status:
          type: string
          enum: [pending, synced, error]
          description: Delivery state of the outbox feed; error keeps the local ledger authoritative and open while Lago is down.
        status:
          type: string
          enum: [pending, active, suspended, ended]
          description: pending -> active on first successful sync; active <-> suspended; active|suspended -> ended (terminal).
      examples:
        - id: "b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000005000000"
          updated_at_us: "1700001200000000"
          revision: "2"
          external_customer_id: "cust_0f0e8b1a"
          external_subscription_id: "sub_meter_0f0e8b1a"
          started_at_us: "1700000005000000"
          ended_at_us: null
          meter_schema_version: meter.v1
          last_outbox_watermark: "1042"
          sync_status: synced
          status: active

    # ------------------------------------------------ supplementary contracts
    PriceVersion:
      type: object
      description: >-
        Immutable versioned price list. Effective interval is [effective_from_us,
        effective_to_us). Each resource carries a rational unit price
        (price_numerator / price_denominator per price unit). Rounding is fixed
        HALF_UP to whole microcredits applied AFTER summing all resources of a
        step with arbitrary precision. Official prices, entitlements and default
        Run caps are versioned configuration; demo values are never sale prices.
        Orders and reservations reference a specific PriceVersion and are never
        affected by later versions; mismatched references are rejected with 409
        price_version_conflict.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - effective_from_us
        - effective_to_us
        - resources
        - rounding
        - default_root_run_cap_microcredits
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
          description: null for organization-global price versions.
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        effective_from_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        effective_to_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
        resources:
          type: array
          minItems: 1
          items:
            type: object
            required: [resource, price_unit, price_numerator, price_denominator]
            additionalProperties: false
            properties:
              resource:
                $ref: "#/components/schemas/ResourceKind"
              price_unit:
                type: string
                description: Unit the rational price is expressed per (e.g. 1000 tokens).
                minLength: 1
                maxLength: 64
                pattern: "^[A-Za-z0-9._:-]{1,64}$"
              price_numerator:
                $ref: "./scalars.yaml#/components/schemas/PriceNumerator"
              price_denominator:
                $ref: "./scalars.yaml#/components/schemas/PriceDenominator"
        rounding:
          type: string
          const: half_up
          description: Only HALF_UP to microcredits after exact rational summation is contract-legal.
        default_root_run_cap_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
          description: Default RootRunBudget cap sourced from this versioned config; never a hard-coded demo number.
        status:
          type: string
          enum: [draft, active, retired]
          description: draft -> active at effective_from_us -> retired at/after effective_to_us. Active versions are immutable.
      x-immutability: append-only
      examples:
        - id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: null
          created_at_us: "1699999000000000"
          updated_at_us: "1699999000000000"
          revision: "1"
          effective_from_us: "1700000000000000"
          effective_to_us: null
          resources:
            - resource: model_input_tokens
              price_unit: "1000"
              price_numerator: "37"
              price_denominator: "1000000"
            - resource: model_output_tokens
              price_unit: "1000"
              price_numerator: "111"
              price_denominator: "1000000"
          rounding: half_up
          default_root_run_cap_microcredits: "5000000"
          status: active

    BillingSubscription:
      type: object
      description: >-
        Monthly subscription state. Monthly periods are computed in
        Asia/Shanghai from the ORIGINAL purchase date and time, month-end dates
        clamp (e.g. Jan 31 -> Feb 28) and the original day number resumes after
        short months. First purchase and re-purchase after expiry start at
        confirmed activation; early renewal is at most one period ahead and
        grants land only when the next period starts. Subscription entitlement
        is NOT balance: expiring subscription credits still follow lot expiry.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - original_purchased_at_us
        - current_period_start_us
        - current_period_end_us
        - timezone
        - period_months
        - prepaid_periods_ahead
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        original_purchased_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: Confirmed activation instant of the FIRST purchase; anchors all month anchors in Asia/Shanghai local date-time.
        current_period_start_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        current_period_end_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: Exclusive end ([start_us, end_us)).
        timezone:
          type: string
          const: Asia/Shanghai
          description: OpenBot billing period timezone; Lago itself stays UTC.
        period_months:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        prepaid_periods_ahead:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
          description: Never more than 1 (early renewal limit).
        status:
          type: string
          enum: [pending, active, expired, cancelled]
          description: pending (paid, not yet activated) -> active -> expired|cancelled. Re-purchase after expiry starts a NEW subscription anchored at the new activation.
      examples:
        - id: "c2d3e4f5-a6b7-4c8d-9e0f-1a2b3c4d5e6f"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1699999500000000"
          updated_at_us: "1700000000000000"
          revision: "2"
          original_purchased_at_us: "1699999545000000"
          current_period_start_us: "1699999545000000"
          current_period_end_us: "1702418745000000"
          timezone: Asia/Shanghai
          period_months: "1"
          prepaid_periods_ahead: "0"
          status: active

    RootRunBudget:
      type: object
      description: >-
        Fixed payer/account and cost cap for one root run. ALL child runs,
        delegations and subagents share settled_microcredits +
        outstanding_reserved_microcredits <= cap_microcredits, enforced
        atomically with balance reservation (same mutual exclusion as balance).
        The default cap comes from the active PriceVersion configuration, never
        a hard-coded demo number. Cap increases require the PAYING user's
        explicit confirmation recorded in cap_increase_authorization — never a
        subagent, an automatic renewal, or any derived actor. The cap is
        independent of any gateway/wallet budget.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - root_run_id
        - price_version_id
        - cap_microcredits
        - settled_microcredits
        - outstanding_reserved_microcredits
        - cap_grant_revision
        - cap_increase_authorization
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        root_run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        price_version_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Version whose default_root_run_cap_microcredits seeded this budget.
        cap_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
        settled_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        outstanding_reserved_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
          description: Sum of unsettled reservations; invariant settled + outstanding_reserved <= cap.
        cap_grant_revision:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Revision"
          description: Increments on every explicit cap change for optimistic concurrency.
        cap_increase_authorization:
          type: ["object", "null"]
          description: Present only for raised caps; records the paying user's explicit confirmation. Subagents and automatic renewals can never create it.
          required: [confirmed_by, confirmed_at_us, authorization_revision]
          additionalProperties: false
          properties:
            confirmed_by:
              $ref: "./scalars.yaml#/components/schemas/SubjectId"
              description: MUST be the paying user's own confirmed action.
            confirmed_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            authorization_revision:
              $ref: "./scalars.yaml#/components/schemas/Revision"
        status:
          type: string
          enum: [active, exhausted, closed]
          description: active while settled+reserved < cap; exhausted at equality (still allows settle/release bookkeeping); closed at run end (terminal).
      examples:
        - id: "d3e4f5a6-b7c8-4d9e-8f0a-1b2c3d4e5f6a"
          schema_version: billing.v1
