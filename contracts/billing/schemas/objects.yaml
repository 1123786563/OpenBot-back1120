    UsageEvent:
      type: object
      description: >-
        One metered usage occurrence feeding both local ledger and the Lago
        outbox. source_event_id is stable and globally unique (duplicates
        dedupe); occurrence_us is preserved exactly and generates the Lago
        timestamp as a precise decimal-seconds string. Events attach to their
        original period for late attribution. Lago outage never blocks the
        local ledger; ledger outage stops new consumption (503 ledger_unavailable).
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - source_event_id
        - settlement_id
        - root_run_id
        - run_id
        - step_id
        - call_id
        - bot_id
        - cost_bearer
        - occurrence_us
        - source_period_id
        - price_version_id
        - items
        - outbox_status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        source_event_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        settlement_id:
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
        root_run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        step_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        call_id:
          type: ["string", "null"]
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        bot_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        cost_bearer:
          $ref: "./scalars.yaml#/components/schemas/CostBearer"
        occurrence_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        source_period_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        price_version_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        items:
          type: array
          minItems: 1
          items:
            $ref: "./common.yaml#/components/schemas/UsageItem"
        outbox_status:
          type: string
          enum: [pending, sent, failed]
          description: Delivery state to Lago; retried without limit while the local ledger stays authoritative.
      examples:
        - id: "e4f5a6b7-c8d9-4e0f-9a1b-2c3d4e5f6a7b"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000301000000"
          updated_at_us: "1700000301000000"
          revision: "1"
          source_event_id: "evt_settle_call_9f8e7d6c"
          settlement_id: "7f8a9b0c-1d2e-4f3a-8b4c-5d6e7f8a9b0c"
          root_run_id: "5d6e7f80-91a2-4b1c-8d3e-4f5a6b7c8d9e"
          run_id: "6e7f8091-a2b3-4c2d-9e4f-5a6b7c8d9e0f"
          step_id: "step_0007"
          call_id: "call_9f8e7d6c"
          bot_id: "bot_01hx"
          cost_bearer: user
          occurrence_us: "1700000300000000"
          source_period_id: "period_2026-11"
          price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
