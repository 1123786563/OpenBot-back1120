    ProductQuote:
      type: object
      description: >-
        Read-only product quote: sellability over the release selected by the
        SERVER's trusted clock, the full immutable snapshot when sellable, the
        eligibility outcome, and a period preview ONLY when the target period
        is already determined (renewal on an active subscription). Quotes are
        observations: they create nothing and occupy no purchase slot.
      required: [sellable, test_only, quoted_at_us]
      additionalProperties: false
      properties:
        sellable:
          type: boolean
        not_sellable_reason:
          $ref: "#/components/schemas/SellabilityReason"
          description: Present exactly when sellable=false.
        test_only:
          type: boolean
          description: True when the selected configuration is explicitly test-only; a test quote is never a production sale.
        quoted_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        snapshot:
          type: object
          description: Present exactly when sellable=true — the full immutable version bundle backing this quote.
          required:
            - release_id
            - release_content_digest
            - scope_is_account_specific
            - product_version_id
            - product_id
            - product_type
            - display_name
            - amount_fen
            - currency
            - granted_microcredits
            - period_months
            - long_lived
            - price_version_id
            - quota_version_id
            - basic_quota_version_id
            - run_cap_version_id
            - run_cap_microcredits
          additionalProperties: false
          properties:
            release_id:
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            release_content_digest:
              type: string
              minLength: 64
              maxLength: 128
              pattern: "^[0-9a-f]{64,128}$"
            scope_is_account_specific:
              type: boolean
            product_version_id:
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            product_id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
            product_type:
              type: string
              enum: [monthly_plan, credit_pack]
            display_name:
              type: string
              minLength: 1
              maxLength: 200
            amount_fen:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Fen"
            currency:
              $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
            granted_microcredits:
              $ref: "./scalars.yaml#/components/schemas/MicrocreditsNullable"
            period_months:
              $ref: "./scalars.yaml#/components/schemas/UnsignedInt64Nullable"
            long_lived:
              type: boolean
              description: True for credit packs (no monthly validity); false for monthly plans.
            price_version_id:
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            quota_version_id:
              $ref: "./scalars.yaml#/components/schemas/UuidNullable"
            basic_quota_version_id:
              $ref: "./scalars.yaml#/components/schemas/Uuid"
              description: The release's BASIC-tier quota version — the base resource ceilings sold with this product.
            run_cap_version_id:
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            run_cap_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
        period_preview:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/MonthPeriodDescriptor"
          description: Determined target period (renewal/prepurchase); null when activation will define a new anchor.
        eligibility:
          $ref: "#/components/schemas/PurchaseEligibility"
      examples:
        - sellable: true
          test_only: false
          quoted_at_us: "1700003600000000"
          snapshot:
            release_id: "aa000000-0000-4000-8000-000000000004"
            release_content_digest: "5f1bfe13c9be43bab4a1e12bfa5a4e19c1be90b3ba5a1e1d0b2c3d4e5f607182"
            scope_is_account_specific: false
            product_version_id: "aa000000-0000-4000-8000-000000000001"
            product_id: "pack_1m_credits"
            product_type: credit_pack
            display_name: "1M credits pack"
            amount_fen: "9900"
            currency: CNY
            granted_microcredits: "1000000"
            period_months: null
            long_lived: true
            price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
            quota_version_id: null
            basic_quota_version_id: "aa000000-0000-4000-8000-000000000005"
            run_cap_version_id: "aa000000-0000-4000-8000-000000000003"
            run_cap_microcredits: "5000000"
          period_preview: null
          eligibility:
            allowed: true
            reason: eligible
            next_action: create_order
            target_period: null
            state_revision: "3"
            existing_commitment: null

    CurrentPriceResolution:
      type: object
      description: >-
        The CURRENT published pricing basis for NEW steps, resolved by the
        SERVER's trusted clock, account authorization and deployment
        environment — never a caller-chosen version id. Returns the release
        the clock selects with its pinned price version and default Run cap;
        the caller uses price_version_id both for the step vector and as the
        reserved fixed reference recorded on the step. Draft, never-released,
        foreign-environment and foreign-account configurations can never be
        resolved here; an absent or incomplete release answers sellable=false
        with a closed reason, never a zero price. Read-only observation.
      required: [sellable, test_only, quoted_at_us, prices]
      additionalProperties: false
      properties:
        sellable:
          type: boolean
        not_sellable_reason:
          $ref: "#/components/schemas/SellabilityReason"
          description: Present exactly when sellable=false.
        test_only:
          type: boolean
          description: True when the resolved release is explicitly test-only.
        quoted_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        release_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Present exactly when sellable=true.
        release_content_digest:
          type: string
          minLength: 64
          maxLength: 128
          pattern: "^[0-9a-f]{64,128}$"
          description: Present exactly when sellable=true.
        scope_is_account_specific:
          type: boolean
          description: Present exactly when sellable=true.
        price_version_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: The pinned price version NEW steps must quote (and reserve).
        run_cap_version_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        run_cap_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
        prices:
          type: array
          minItems: 1
          items:
            type: object
            required: [resource, measurement_unit, unit_size, numerator, denominator]
            additionalProperties: false
            properties:
              resource:
                $ref: "#/components/schemas/ResourceKind"
              measurement_unit:
                $ref: "#/components/schemas/MeasurementUnit"
              unit_size:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              numerator:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              denominator:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
      examples:
        - sellable: true
          test_only: false
          quoted_at_us: "1700003600000000"
          release_id: "aa000000-0000-4000-8000-000000000004"
          release_content_digest: "5f1bfe13c9be43bab4a1e12bfa5a4e19c1be90b3ba5a1e1d0b2c3d4e5f607182"
          scope_is_account_specific: false
          price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          run_cap_version_id: "aa000000-0000-4000-8000-000000000003"
          run_cap_microcredits: "5000000"
          prices:
            - resource: model_input_tokens
              measurement_unit: token
              unit_size: "1"
              numerator: "1"
              denominator: "1000000"

    StepQuote:
      type: object
      description: >-
        Read-only exact cost of one execution step against a PINNED price
        version. All resources are summed as ONE exact rational and rounded
        exactly once (HALF_UP to whole microcredits) — never per token, per
        line or per stream fragment. The full pricing basis is echoed so the
        total can be recomputed offline. Only versions a release has pinned
        at least once are quotable — draft, never-released and
        foreign-environment configurations answer 404 like a missing row; an
        expected_price_version_id that diverges from the quoted version is 409
        price_version_conflict (a step is always recomputed against its own
        reserved fixed reference).
      required: [price_version_id, rounding, lines, total_microcredits, total_display]
      additionalProperties: false
      properties:
        price_version_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: The version the cost was computed from; pinned at reservation, never the currently-active list.
        rounding:
          type: string
          const: half_up
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [resource, quantity, measurement_unit, unit_size, numerator, denominator]
            additionalProperties: false
            properties:
              resource:
                $ref: "#/components/schemas/ResourceKind"
              quantity:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              measurement_unit:
                $ref: "#/components/schemas/MeasurementUnit"
              unit_size:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              numerator:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              denominator:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        total_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        total_display:
          type: string
          description: The total rendered with the contract's exact six-decimal credit display.
          minLength: 8
          maxLength: 64
          pattern: "^[0-9]+\\.[0-9]{6}$"
      examples:
        - price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          rounding: half_up
          lines:
            - resource: model_input_tokens
              quantity: "9007199254740993"
              measurement_unit: token
              unit_size: "1"
              numerator: "1"
              denominator: "1000000"
          total_microcredits: "9007199254740993"
          total_display: "9007199254740993.000000"

    StepSettlementQuote:
      type: object
      description: >-
        Read-only exact settlement cost of one RESERVED step, priced against
        the version the step's TRUSTED reservation pins — resolved
        server-side from the reservation reader, never from a request field.
        Arithmetic and rounding are identical to StepQuote: one exact rational
        summed over the merged resource vector, ONE HALF_UP rounding to whole
        microcredits, with the full pricing basis echoed for offline
        recomputation. price_version_id is therefore the TRUSTED pinned
        version the settlement actually used; a settlement can never silently
        run under another configuration.
      required: [step_reservation_ref, price_version_id, rounding, lines, total_microcredits, total_display]
      additionalProperties: false
      properties:
        step_reservation_ref:
          type: string
          description: Echo of the settled step's trusted reservation reference.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        price_version_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: The reservation's pinned version the cost was computed from (trusted, not caller-nominated).
        rounding:
          type: string
          const: half_up
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [resource, quantity, measurement_unit, unit_size, numerator, denominator]
            additionalProperties: false
            properties:
              resource:
                $ref: "#/components/schemas/ResourceKind"
              quantity:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              measurement_unit:
                $ref: "#/components/schemas/MeasurementUnit"
              unit_size:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              numerator:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              denominator:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        total_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        total_display:
          type: string
          description: The total rendered with the contract's exact six-decimal credit display.
          minLength: 8
          maxLength: 64
          pattern: "^[0-9]+\\.[0-9]{6}$"
      examples:
        - step_reservation_ref: "step_01hf3k8m2q.reservation"
          price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          rounding: half_up
          lines:
            - resource: model_input_tokens
              quantity: "9007199254740993"
              measurement_unit: token
              unit_size: "1"
              numerator: "1"
              denominator: "1000000"
          total_microcredits: "9007199254740993"
          total_display: "9007199254740993.000000"

    PeriodAnswer:
      type: object
      description: >-
        Deterministic Beijing-time period answer: the original activation
        anchor (UTC instant AND local wall time), and the located or requested
        [B(n), B(n+1)) period with integer-microsecond UTC boundaries, ISO
        renderings and local wall times.
      required: [timezone, anchor, period]
      additionalProperties: false
      properties:
        timezone:
          type: string
          const: Asia/Shanghai
        anchor:
          type: object
          required: [utc_us, utc_iso, local]
          additionalProperties: false
          properties:
            utc_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            utc_iso:
              type: string
              minLength: 20
              maxLength: 40
            local:
              $ref: "#/components/schemas/LocalWallTime"
        period:
          $ref: "#/components/schemas/MonthPeriodDescriptor"
      examples:
        - timezone: Asia/Shanghai
          anchor:
            utc_us: "1706679015123456"
            utc_iso: "2024-01-31T01:30:15.123456Z"
            local:
              year: 2024
              month: 1
              day: 31
              hour: 9
              minute: 30
              second: 15
              microsecond: 123456
          period:
            index: "0"
            start_us: "1706679015123456"
            end_us: "1709170215123456"
            start_iso: "2024-01-31T01:30:15.123456Z"
            end_iso: "2024-02-29T01:30:15.123456Z"
            start_local:
              year: 2024
              month: 1
              day: 31
              hour: 9
              minute: 30
              second: 15
              microsecond: 123456
            end_local:
              year: 2024
              month: 2
              day: 29
              hour: 9
              minute: 30
              second: 15
              microsecond: 123456

    QuotaContent:
      type: object
      description: The full content of one quota version — tier plus every closed-key ceiling, so a sold entitlement can be reconstructed from the snapshot alone.
      required: [quota_version_id, tier, quotas]
      additionalProperties: false
      properties:
        quota_version_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        tier:
          type: string
          enum: [basic, subscription]
        quotas:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [resource_key, limit, unit]
            additionalProperties: false
            properties:
              resource_key:
                type: string
                enum: [concurrent_runs, automatic_task_seats]
              limit:
                type: string
                $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
              unit:
                type: string
                const: count
      examples:
        - quota_version_id: "aa000000-0000-4000-8000-000000000005"
          tier: basic
          quotas:
            - resource_key: concurrent_runs
              limit: "2"
              unit: count
            - resource_key: automatic_task_seats
              limit: "10"
              unit: count

    CatalogVersionSnapshot:
      type: object
      description: Full immutable catalog release snapshot for history replay. Historical reads may answer retired versions but can NEVER be used to purchase against a retired price. The snapshot carries the release's basic quota and every item's full commerce content (price, granted credits and quota), so a historical quote can be recomputed AND its sold entitlement reconstructed from this response alone.
      required:
        - release_id
        - content_digest
        - status
        - environment
        - effective_from_us
        - effective_to_us
        - basic_quota
        - items
      additionalProperties: false
      properties:
        release_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
