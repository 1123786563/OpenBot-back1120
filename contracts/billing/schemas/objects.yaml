    # ------------------------------------------------------------ ledger events
    LedgerLine:
      type: object
      description: >-
        One credit lot's component change caused by one ledger event, with the
        lot's component balances AFTER the change. Signed per-component deltas
        always conserve the lot: the sum of the deltas of granted,
        available, reserved, refund_frozen, consumed, expired and revoked is
        zero, and granted itself only changes on the grant event that created
        the lot — source type, source event, original period and original
        granted amount are never rewritten afterwards.
      required:
        - lot_id
        - delta_granted_microcredits
        - delta_available_microcredits
        - delta_reserved_microcredits
        - delta_refund_frozen_microcredits
        - delta_consumed_microcredits
        - delta_expired_microcredits
        - delta_revoked_microcredits
        - balances_after
      additionalProperties: false
      properties:
        lot_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        delta_granted_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        delta_available_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        delta_reserved_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        delta_refund_frozen_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        delta_consumed_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        delta_expired_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        delta_revoked_microcredits:
          $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
        balances_after:
          type: object
          description: The lot's seven conservation components after this change.
          required:
            - granted_microcredits
            - available_microcredits
            - reserved_microcredits
            - refund_frozen_microcredits
            - consumed_microcredits
            - expired_microcredits
            - revoked_microcredits
          additionalProperties: false
          properties:
            granted_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            available_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            reserved_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            refund_frozen_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            consumed_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            expired_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            revoked_microcredits:
              $ref: "./scalars.yaml#/components/schemas/Microcredits"

    LedgerEvent:
      type: object
      description: >-
        Immutable event head of the append-only ledger: one grant, adjustment
        or expiry fact with its per-lot lines. account_seq is the per-account
        sequence assigned inside the account lock (never a global database
        sequence). Event content — including its business key, original event
        reference, actor, reason, original period and lines — is never
        rewritten; corrections are appended as new events linked by
        adjustment_id/original_event_id. Every committed event has exactly one
        pending outbox record whose aggregate_id equals this id.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - event_type
        - account_seq
        - source_namespace
        - source_event_id
        - original_event_id
        - adjustment_id
        - actor_subject_id
        - reason
        - original_period_id
        - occurred_at_us
        - committed_at_us
        - lines
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        event_type:
          type: string
          enum: [credit.granted, credit.adjusted, credit.expired]
        account_seq:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
          description: Per-account committed sequence; the recovery watermark for outbox delivery.
        source_namespace:
          type: ["string", "null"]
          description: Trusted source namespace of the grant's business key; null for internal expiry events.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        source_event_id:
          type: ["string", "null"]
          description: Business key inside the namespace; null for adjustment/expiry events (their keys live on the adjustment).
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        original_event_id:
          type: ["string", "null"]
          description: Ledger event id an adjustment corrects; null otherwise.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        adjustment_id:
          type: ["string", "null"]
          $ref: "./scalars.yaml#/components/schemas/UuidNullable"
          description: Adjustment row that produced this event; null for grant/expiry events.
        actor_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectIdNullable"
          description: Audited actor (service identity's operator for grants/adjustments; system actor for expiry).
        reason:
          type: ["string", "null"]
          maxLength: 512
          description: Adjustment reason or expiry cause; null on grants.
        original_period_id:
          type: ["string", "null"]
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          description: Original period this event stays attributed to; null for period-less packs.
        occurred_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: Business time of the fact (e.g. the expiry instant), preserved verbatim.
        committed_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: Server commit time.
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LedgerLine"

    OutboxRecord:
      type: object
      description: >-
        Transactionally-committed outbound metering record (committed in the
        same atomic transaction as balances, ledger entries and idempotency
        rows; network calls happen outside transactions). Watermarks advance
        only after confirmed delivery; reconciliation uses fixed watermark +
        expected ID-set comparison over full-page rescans.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - aggregate_type
        - aggregate_id
        - event_type
        - dedupe_key
        - watermark_seq
        - attempt_count
        - published_at_us
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        aggregate_type:
          type: string
          enum: [usage_event, metering_relationship, ledger_event]
          description: >-
            ledger_event marks the LOCAL ledger facts (#64): grant, adjustment
            and expiry events of the credit ledger. They are accounting facts
            for the delivery worker (#73) to project — they are NEVER usage
            events: a grant creates no consumption, no metering charge and no
            CNY receivable.
        aggregate_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        event_type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
        dedupe_key:
          type: string
          description: Stable source id; Lago-side dedupe anchor (channel callbacks use channel message/transaction ids instead).
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        watermark_seq:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        attempt_count:
          type: string
          $ref: "./scalars.yaml#/components/schemas/UnsignedInt64"
        published_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
        status:
          type: string
          enum: [pending, sent, failed]
          description: pending -> sent after confirmed publish; failed keeps retrying; recovery after crash resumes from the watermark without duplicates.
      examples:
        - id: "f5a6b7c8-d9e0-4f1a-8b2c-3d4e5f6a7b8c"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000301000000"
          updated_at_us: "1700000302000000"
          revision: "1"
          aggregate_type: usage_event
          aggregate_id: "e4f5a6b7-c8d9-4e0f-9a1b-2c3d4e5f6a7b"
          event_type: usage.settled
          dedupe_key: "evt_settle_call_9f8e7d6c"
          watermark_seq: "1043"
          attempt_count: "0"
          published_at_us: null
          status: pending

    CreateCreditGrantRequest:
      type: object
      description: >-
        Trusted grant input. The source namespace and actor come from the
        authenticated service credential; the request can never choose them.
        Period and expiry follow the source type: subscription requires a
        period id and a finite expiry after valid_from (from the trusted
        period result); pack forbids both; compensation requires the original
        deduction event reference.
      required:
        - billing_account_id
        - source_event_id
        - source_type
        - granted_microcredits
        - valid_from_us
        - expires_at_us
        - original_event_id
        - actor_subject_id
      additionalProperties: false
      properties:
        billing_account_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Target account; the credential must be authorized for its organization.
        source_event_id:
          type: string
          description: Stable business key of THIS grant inside the credential's source namespace; dedupe anchor across idempotency keys.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        source_type:
          type: string
          enum: [subscription, pack, compensation]
        source_period_id:
          type: ["string", "null"]
          description: Original billing period; REQUIRED and non-null for subscription, null for pack/compensation.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        granted_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
        valid_from_us:
          type: string
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: When the lot becomes spendable; earlier instants answer the scheduled status until reached.
        expires_at_us:
          type: ["string", "null"]
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
          description: Absolute expiry; REQUIRED finite and after valid_from_us for subscription; null for pack; compensation sends null or the server-computed arrival+30d echo.
        original_event_id:
          type: ["string", "null"]
          description: Original deduction event a compensation restores; REQUIRED for source_type=compensation, null otherwise.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        actor_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
          description: Audited operator on whose behalf the trusted service acts.
      allOf:
        - if:
            properties:
              source_type:
                const: subscription
            required: [source_type]
          then:
            properties:
              source_period_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: "^[A-Za-z0-9._:-]{1,128}$"
              expires_at_us:
                type: string
                $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            required: [source_period_id, expires_at_us]
            description: subscription grants always carry their period and a finite expiry.
        - if:
            properties:
              source_type:
                const: pack
            required: [source_type]
          then:
            properties:
              source_period_id:
                type: "null"
              expires_at_us:
                type: "null"
              original_event_id:
                type: "null"
            description: packs are long-lived and period-less.
        - if:
            properties:
              source_type:
                const: compensation
            required: [source_type]
          then:
            properties:
              original_event_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: "^[A-Za-z0-9._:-]{1,128}$"
              expires_at_us:
                type: ["string", "null"]
                $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
              source_period_id:
                type: "null"
            required: [original_event_id]
            description: >-
              compensation links its original deduction event. Shares whose
              original source is still valid are restored IN PLACE with the
              original lot's validity; only shares whose source subscription
              has expired become a compensation lot expiring 30 days after
              grant arrival. expires_at_us is the caller's optional echo of
              that server-computed instant — send null, or exactly
              arrival+30d (small transport tolerance); any other value is
              refused, and the server never adopts a caller-declared expiry.
              Total recovery across ALL entries (grants and adjustments) can
              never exceed the original deduction.

    CreditGrantMutationResult:
      type: object
      description: Created (or replayed) grant; the lot id, ledger event id and account revision are stable under replay.
      required: [credit_lot, ledger_event_id, billing_account, request_id]
      additionalProperties: false
      properties:
        credit_lot:
          $ref: "./objects.yaml#/components/schemas/CreditLot"
          description: >-
            The issued compensation lot when the recovery includes an
            expired-source share; otherwise the original credit lot after the
            in-place restoration (the largest restored share when one
            deduction spanned several live lots).
        ledger_event_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account:
          $ref: "./objects.yaml#/components/schemas/BillingAccount"
        request_id:
          type: string
          minLength: 1
          maxLength: 128

    RegisterBillingAccountRequest:
      type: object
      description: >-
        Trusted registration input from the identity service; a browser can
        never reach this. The subject and Personal Workspace are stable
        identity facts — never an email or a client payer claim.
      required: [organization_id, owner_subject_id, personal_workspace_id]
      additionalProperties: false
      properties:
        organization_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        owner_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
        personal_workspace_id:
          type: string
          description: Personal Workspace relation the account is derived from; unique across accounts.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"

    RegisterBillingAccountResult:
      type: object
      description: Registered (or replayed) account; one stable subject always answers the same account id.
      required: [billing_account, request_id]
      additionalProperties: false
      properties:
        billing_account:
          $ref: "./objects.yaml#/components/schemas/BillingAccount"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
