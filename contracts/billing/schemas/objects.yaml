# billing contract — core and supplementary object contracts
# (authoritative; referenced from openapi.yaml)
#
# State machines: JSON Schema can enumerate the states but cannot enforce
# transitions. The legal transitions below are enforced by the contract semantic
# checker (fixtures) and, at run time, by the ledger implementation (#64/#66).
# Terminal states are never left.
components:
  schemas:
    ResourceKind:
      type: string
      description: Metered resource kinds priced by a PriceVersion. The list is closed; new resources require a contract change. tool_call_duration_ms carries whole milliseconds — a duration arriving in finer units is converted ONCE per resource by the trusted adapter before pricing, never per fragment.
      enum:
        - model_input_tokens
        - model_output_tokens
        - model_cache_read_tokens
        - model_cache_write_tokens
        - model_web_search_requests
        - model_request_count
        - tool_call_count
        - tool_call_duration_ms
      examples: ["model_input_tokens"]

    MeasurementUnit:
      type: string
      description: Closed set of measurement units a price is expressed per. The contract's unit_size says how many of THIS unit one price covers.
      enum:
        - token
        - request
        - call
        - millisecond
      examples: ["token"]

    # ---------------------------------------------------------------- account
    BillingAccount:
      type: object
      description: >-
        Personal payment account. Exactly one active personal payment account
        exists per stable personal identity (owner_subject_id). The owner is
        resolved server-side from the stable subject id and the Personal
        Workspace relation; it is never derived from email, deployer, bot
        creator, or client-submitted payer claims. Status changes to suspended
        or closed stop NEW consumption while in-flight reservations and
        settlements continue to be processed. currency is fixed CNY. Balance
        fields are the account-level projection of credit lots and are never
        allowed to go negative.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - owner_subject_id
        - personal_workspace_id
        - currency
        - available_microcredits
        - reserved_microcredits
        - refund_frozen_microcredits
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Equals id — the account is its own billing account.
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        owner_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
        personal_workspace_id:
          type: string
          description: Personal Workspace relation this account is derived from.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        currency:
          $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
        available_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        reserved_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        refund_frozen_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        status:
          type: string
          enum: [active, suspended, closed]
          description: active -> suspended -> active; active|suspended -> closed (terminal). closed never reopens.
      examples:
        - id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000000000000"
          updated_at_us: "1700000100000000"
          revision: "3"
          owner_subject_id: "subj_01hx8z3k2m"
          personal_workspace_id: "ws_01hx8z3k2m"
          currency: CNY
          available_microcredits: "600000"
          reserved_microcredits: "200000"
          refund_frozen_microcredits: "50000"
          status: active

    # ------------------------------------------------------------------- lots
    CreditLot:
      type: object
      description: >-
        One granted bucket of credits with its own lifecycle. Conservation
        invariant (enforced by the contract semantic checker and, at run time,
        by the ledger): granted_microcredits = available_microcredits +
        reserved_microcredits + refund_frozen_microcredits + consumed_microcredits
        + expired_microcredits + revoked_microcredits, every term non-negative.
        Consumption order: nearest expiry first, then long-lived lots last; ties
        broken by (created_at_us, id). released-after-expiry amounts move to
        expired_microcredits, never back to available. frozen status means part
        of the lot is refund-frozen, not that the whole lot is unusable.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - source_type
        - source_event_id
        - source_period_id
        - granted_microcredits
        - available_microcredits
        - reserved_microcredits
        - refund_frozen_microcredits
        - consumed_microcredits
        - expired_microcredits
        - revoked_microcredits
        - valid_from_us
        - expires_at_us
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        source_type:
          type: string
          enum: [subscription, pack, compensation]
          description: subscription = monthly plan grant; pack = long-lived credit pack; compensation = platform compensation lot (from an expired subscription source it is valid for 30 days after grant).
        source_event_id:
          type: string
          description: Stable id of the originating purchase/compensation event; idempotent re-grants dedupe on it.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
          x-not-personal-identity: true
        source_period_id:
          type: ["string", "null"]
          description: Billing period the grant belongs to; null for period-less packs.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        granted_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        available_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        reserved_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        refund_frozen_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        consumed_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        expired_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        revoked_microcredits:
          $ref: "./scalars.yaml#/components/schemas/Microcredits"
        valid_from_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        expires_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUsNullable"
          description: Absolute expiry instant; null for long-lived packs. Packs are long-lived; subscription grants expire with the period.
        status:
          type: string
          enum: [scheduled, active, frozen, exhausted, expired, revoked]
          description: >-
            scheduled -> active at valid_from_us. active -> exhausted when
            available+reserved+refund_frozen reach 0. active -> expired at
            expires_at_us (remaining available+reserved released to expired).
            active/frozen -> revoked on revocation (terminal). frozen is a
            partial marker and returns to the pre-freeze state when the freeze
            is lifted.
      examples:
        - id: "3b4c5d6e-7f80-4a9b-8c1d-2e3f4a5b6c7d"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000000000000"
          updated_at_us: "1700000200000000"
          revision: "4"
          source_type: subscription
          source_event_id: "evt_sub_2026M11_grant"
          source_period_id: "period_2026-11"
          granted_microcredits: "1000000"
          available_microcredits: "600000"
          reserved_microcredits: "200000"
          refund_frozen_microcredits: "50000"
          consumed_microcredits: "100000"
          expired_microcredits: "30000"
          revoked_microcredits: "20000"
          valid_from_us: "1700000000000000"
          expires_at_us: "1702512000000000"
          status: active

    # ----------------------------------------------------------- reservations
    Reservation:
      type: object
      description: >-
        Reserve-first hold on credits for one execution step. Created ONLY by a
        trusted execution service through the internal API after the server
        re-verifies the payer authorization; the browser can never create or
        report one. Links the call to payer, bot, budget and price snapshot.
        max_cost_microcredits must cover the enforceable worst case of the
        step; a step whose cost cannot be bounded is rejected (unbounded_cost).
        unknown_usage_deadline_us = reserved_at_us + 24h at most, never extended
        by retries or status changes; when the deadline passes with unknown
        usage the reservation is released and late costs are platform-borne.
        Reservation, settlement and release race on the same atomic terminal
        transition — the successful committer wins.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - root_run_id
        - run_id
        - step_id
        - call_id
        - bot_id
        - payer_authorization_id
        - price_version_id
        - max_cost_microcredits
        - allocations
        - reserved_at_us
        - unknown_usage_deadline_us
        - usage_status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        root_run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Root Run whose RootRunBudget caps this reservation; all child runs, delegations and subagents share the same payer and cap.
        run_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        step_id:
          type: string
          description: Execution step that reserves the credits.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        call_id:
          type: ["string", "null"]
          description: One actual model invocation; null for reservations of non-model steps. Exactly one reservation per call_id — stream fragments never accumulate twice.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        bot_id:
          type: string
          description: Executing bot context (#32). Required for every reservation; never used to derive the payer.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        payer_authorization_id:
          type: string
          description: Server-verified payer authorization reference; the payer is fixed at reservation time and inherited by the whole child chain.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        price_version_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
          description: Price version snapshot locked at reserve time; later price changes do not affect this step.
        max_cost_microcredits:
          type: string
          $ref: "./scalars.yaml#/components/schemas/PositiveMicrocredits"
          description: Enforceable upper bound of the step cost; allocations total must not exceed it.
        allocations:
          type: array
          items:
            $ref: "./common.yaml#/components/schemas/Allocation"
          minItems: 1
          description: Credit-lot splits (nearest expiry first). Sum of allocations == amounts held from available at reserve time.
        reserved_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        unknown_usage_deadline_us:
          type: string
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: reserved_at_us + at most 24h. At the deadline unknown usage is released; after the deadline no NEW user charge may be created for this reservation.
        usage_status:
          type: string
          enum: [reserved, awaiting_usage, settled, released]
          description: >-
            reserved -> awaiting_usage (request dispatched); reserved ->
            settled|released directly (cancel / immediate settle);
            awaiting_usage -> settled|released. settled and released are
            terminal and immutable; a terminal state is never re-entered or
            changed. Release after the deadline and settle race on the same
            atomic terminal condition.
      examples:
        - id: "4c5d6e7f-8091-4a0b-9c2d-3e4f5a6b7c8d"
          schema_version: billing.v1
          organization_id: "2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d"
          billing_account_id: "0f0e8b1a-7c42-4d5e-9a1b-2f3c4d5e6f70"
          created_at_us: "1700000300000000"
          updated_at_us: "1700000300000000"
          revision: "1"
          root_run_id: "5d6e7f80-91a2-4b1c-8d3e-4f5a6b7c8d9e"
          run_id: "6e7f8091-a2b3-4c2d-9e4f-5a6b7c8d9e0f"
          step_id: "step_0007"
          call_id: "call_9f8e7d6c"
          bot_id: "bot_01hx"
          payer_authorization_id: "auth_01hx8z3k2m"
          price_version_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
          max_cost_microcredits: "200000"
          allocations:
            - lot_id: "3b4c5d6e-7f80-4a9b-8c1d-2e3f4a5b6c7d"
              amount_microcredits: "150000"
            - lot_id: "7f8091a2-b3c4-4d5e-8f6a-7b8c9d0e1f2a"
              amount_microcredits: "50000"
          reserved_at_us: "1700000300000000"
          unknown_usage_deadline_us: "1700086700000000"
          usage_status: reserved

    # ------------------------------------------------------------- settlement
    Settlement:
      type: object
      description: >-
        Immutable final settlement of exactly one reservation (business-unique
        constraint on reservation_id, independent of any HTTP idempotency key).
        posted is terminal; late-arriving usage after posting produces appended
        attribution records / Adjustments, never a rewritten settlement. Usage
        is reported by the trusted settlement service only — browser self-reports
        are never accepted. charged goes to consumed in the allocated lots;
        the unused remainder is released back to available (or to expired if the
        lot expired in the meantime). Actual cost above max_cost_microcredits is
        platform-borne and never creates a user negative balance or post-hoc
        recovery. Cancellation settles only valid consumption that actually
        happened; platform faults and duplicate execution are platform-borne;
        self-paid models charge no platform credits.
      allOf:
        - $ref: "./common.yaml#/components/schemas/CommonFields"
        - type: object
          required:
            - reservation_id
            - source_event_id
            - usage_items
            - charged_microcredits
            - released_microcredits
            - platform_cost_microcredits
            - cost_bearer
            - occurred_at_us
            - settled_at_us
            - source_period_ids
            - price_version_id
            - status
          properties:
            reservation_id:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            source_event_id:
              type: string
              description: Stable settlement source event; idempotency anchor for re-delivered settlement requests.
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              x-not-personal-identity: true
            usage_items:
              type: array
              items:
                $ref: "./common.yaml#/components/schemas/UsageItem"
              description: Exact usage lines; each item carries the locked price_version_id.
            charged_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
              description: Total charged to the user (HALF_UP over the sum of all resource costs, not per item).
            released_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
            platform_cost_microcredits:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Microcredits"
              description: Overage and platform-fault consumption borne by the platform.
            cost_bearer:
              $ref: "./scalars.yaml#/components/schemas/CostBearer"
            occurred_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
              description: When the usage actually happened; preserved verbatim for Lago timestamp generation and late-event period attribution.
            settled_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            source_period_ids:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 128
              minItems: 1
              description: Original billing period(s) the usage is attributed to; late events stay in their original period.
            price_version_id:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Uuid"
            status:
              type: string
              enum: [posted]
              description: Terminal and immutable.
      unevaluatedProperties: false
      x-immutability: append-only

    # ------------------------------------------------------------- adjustment
    Adjustment:
      type: object
      description: >-
        Immutable appended correction to the ledger. Business uniqueness scope =
        (billing_account_id, original_event_id, adjustment_type): the same scope
        cannot be duplicated even with a different HTTP idempotency key. Any
        legitimate follow-up correction must carry its own distinct source
        event id and explicit linkage. Negative deltas credit the account by
        creating/adding to a CompensationLot when compensation_lot_id is set;
        compensation created from an expired-subscription source is valid for
        30 days after grant.actor_subject_id records the audited human or
        service operator.
      allOf:
        - $ref: "./common.yaml#/components/schemas/CommonFields"
        - type: object
          required:
            - original_event_id
            - adjustment_type
            - source_event_id
            - signed_delta_microcredits
            - reason
            - actor_subject_id
            - original_period_id
            - effective_at_us
            - compensation_lot_id
            - status
          properties:
            original_event_id:
              type: string
              description: Ledger event being corrected.
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              x-not-personal-identity: true
            adjustment_type:
              type: string
              enum: [charge_correction, compensation, late_usage_attribution, expiry_correction, revocation]
              description: Closed set; late_usage_attribution appends ownership for usage found after settlement without rewriting it.
            source_event_id:
              type: string
              description: Distinct source event of THIS correction.
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              x-not-personal-identity: true
            signed_delta_microcredits:
              $ref: "./scalars.yaml#/components/schemas/SignedAdjustmentDelta"
            reason:
              type: string
              minLength: 1
              maxLength: 512
            actor_subject_id:
              $ref: "./scalars.yaml#/components/schemas/SubjectId"
              description: Audited operator (authorized operations / compensation service), not the payer.
            original_period_id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9._:-]{1,128}$"
              description: Adjustment stays attributed to the ORIGINAL period; old snapshots only gain appended confirmation adjustments.
            effective_at_us:
              $ref: "./scalars.yaml#/components/schemas/TimestampUs"
            compensation_lot_id:
              $ref: "./scalars.yaml#/components/schemas/UuidNullable"
              description: Compensation lot created/extended by a positive delta; null when the adjustment does not create one.
            status:
              type: string
              enum: [posted]
              description: Terminal and immutable.
      unevaluatedProperties: false
      x-immutability: append-only

    # ------------------------------------------------------------------ order
    Order:
      type: object
      description: >-
        Purchase order for a priced product. Created by the account owner only
        (organization membership alone is NOT sufficient to pay); unit price and
        payer are never accepted from the client — amount_fen comes from the
        product snapshot of the referenced PriceVersion. Orders expire after 30
        minutes; refreshing the payment link does NOT extend the order. Payment
        that verifiably happened within the validity window is still fulfilled;
        expired payment, duplicate collection and dual-channel success go to
        exception refund handling. Refund progress is aggregated separately and
        never overwrites the fact that payment arrived. Order, payment attempt
        and fulfillment identities are independent; after a crash+restart the
        order is fulfilled exactly once.
      required:
        - id
        - schema_version
        - organization_id
        - billing_account_id
        - created_at_us
        - updated_at_us
        - revision
        - purchaser_subject_id
        - product_id
        - product_type
        - product_snapshot
        - price_version_id
        - amount_fen
        - currency
        - expires_at_us
        - fulfillment_event_id
        - status
      additionalProperties: false
      properties:
        id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        schema_version:
          $ref: "./scalars.yaml#/components/schemas/SchemaVersion"
        organization_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        billing_account_id:
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        created_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        updated_at_us:
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
        revision:
          $ref: "./scalars.yaml#/components/schemas/Revision"
        purchaser_subject_id:
          $ref: "./scalars.yaml#/components/schemas/SubjectId"
        product_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        product_type:
          type: string
          enum: [subscription_monthly, credit_pack]
        product_snapshot:
          type: object
          description: Immutable snapshot of what is being bought (no client-supplied price).
          required: [product_id, product_type, granted_microcredits, period_months, display_name, price_version_id]
          additionalProperties: false
          properties:
            product_id:
              type: string
              minLength: 1
              maxLength: 128
            product_type:
              type: string
              enum: [subscription_monthly, credit_pack]
            granted_microcredits:
              $ref: "./scalars.yaml#/components/schemas/MicrocreditsNullable"
              description: Credits granted by the product; null for subscription tiers that only grant rights.
            period_months:
              $ref: "./scalars.yaml#/components/schemas/UnsignedInt64Nullable"
              description: Subscription length in months; null for packs.
            display_name:
              type: string
              minLength: 1
              maxLength: 200
            price_version_id:
              type: string
              $ref: "./scalars.yaml#/components/schemas/Uuid"
        price_version_id:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Uuid"
        amount_fen:
          type: string
          $ref: "./scalars.yaml#/components/schemas/Fen"
        currency:
          $ref: "./scalars.yaml#/components/schemas/CurrencyCode"
        expires_at_us:
          type: string
          $ref: "./scalars.yaml#/components/schemas/TimestampUs"
          description: created_at_us + 30 minutes, never extended.
        fulfillment_event_id:
          type: ["string", "null"]
          description: Stable id of the single fulfillment event; null until fulfilled. Business-unique per order — exactly one fulfillment even across restarts.
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        status:
          type: string
          enum: [pending, payment_confirming, paid, fulfilling, fulfilled, closing, closed, exception]
          description: >-
            pending -> payment_confirming -> paid -> fulfilling -> fulfilled;
            paid/fulfilling -> exception on anomaly (expired payment, duplicate
            collection, dual-channel success). pending -> closing -> closed at
            expiry after a final query. closed and exception never go back to
            paid states.
      examples:
        - id: "8d9e0f10-a1b2-4c3d-9e4f-6a7b8c9d0e1f"
          schema_version: billing.v1
